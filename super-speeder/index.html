<!DOCTYPE html>

  html, body { margin: 0; height: 100%; background: #10131c; overflow: hidden; }

  canvas { display: block; box-shadow: 0 0 40px #000; border-radius: 10px; outline: none; }
</style>
</head>
<body>
<canvas id="game" width="960" height="640" tabindex="0"></canvas>
<script>
'use strict';
/* =====================================================================
   WESTON SUPER SPEEDER  —  a racing game for Weston
   Little Kid Mode: hold an arrow key to go. The car stays on the road!
   Big Kid Mode:    ↑ gas, ↓ brake, ← → steer.
   SPACE = use your prize (or NITRO when the blue bar is full)
   ===================================================================== */

const W = 960, H = 640;
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const FONT = '"Trebuchet MS","Arial Rounded MT Bold",Verdana,sans-serif';
const EFONT = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';

function fit() {
  const s = Math.min(innerWidth / W, innerHeight / H) * 0.98;
  cv.style.width = (W * s) + 'px';
  cv.style.height = (H * s) + 'px';
}
addEventListener('resize', fit); fit();
cv.focus();

// ---------- little helpers ----------
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const lerp = (a, b, t) => a + (b - a) * t;
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = randi(0, i); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function weighted(mix) {
  let tot = 0; for (const k in mix) tot += mix[k];
  let r = Math.random() * tot;
  for (const k in mix) { r -= mix[k]; if (r <= 0) return k; }
  return Object.keys(mix)[0];
}
function rr(x, y, w, h, r, c = ctx) {
  r = Math.min(r, w / 2, h / 2);
  c.beginPath();
  c.moveTo(x + r, y); c.lineTo(x + w - r, y); c.quadraticCurveTo(x + w, y, x + w, y + r);
  c.lineTo(x + w, y + h - r); c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  c.lineTo(x + r, y + h); c.quadraticCurveTo(x, y + h, x, y + h - r);
  c.lineTo(x, y + r); c.quadraticCurveTo(x, y, x + r, y); c.closePath();
}
function circle(x, y, r, c = ctx) { c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); }
function text(str, x, y, size, color = '#fff', align = 'center', stroke = '#12151f') {
  ctx.font = `900 ${size}px ${FONT}`;
  ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  ctx.lineWidth = Math.max(3, size / 5); ctx.strokeStyle = stroke;
  ctx.strokeText(str, x, y); ctx.fillStyle = color; ctx.fillText(str, x, y);
}
function emoji(e, x, y, size, alpha = 1) {
  ctx.save(); ctx.globalAlpha *= alpha;
  ctx.font = `${size}px ${EFONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#fff'; ctx.fillText(e, x, y); ctx.restore();
}
function lighten(hex, amt = 50) {
  const n = parseInt(hex.slice(1), 16);
  const r = Math.min(255, (n >> 16) + amt), g = Math.min(255, ((n >> 8) & 255) + amt), b = Math.min(255, (n & 255) + amt);
  return `rgb(${r},${g},${b})`;
}
const ordinal = n => n + (n === 1 ? 'st' : n === 2 ? 'nd' : n === 3 ? 'rd' : 'th');

// ---------- saved stuff (stars, unlocked tracks, last picks) ----------
let save = { stars: 0, tracks: 1, players: 1, mode: ['little', 'little'], car: ['blue', 'gold'], decal: ['none', 'none'], track: 0 };
try { Object.assign(save, JSON.parse(localStorage.getItem('speeder_save') || '{}')); } catch (e) { }
function writeSave() { try { localStorage.setItem('speeder_save', JSON.stringify(save)); } catch (e) { } }

// ---------- input ----------
const keys = {};
const mouse = { x: W / 2, y: H / 2 };
const CTRL = [
  { up: ['ArrowUp'], down: ['ArrowDown'], left: ['ArrowLeft'], right: ['ArrowRight'], use: ['Space', 'ShiftRight', 'Slash'], horn: ['Enter'] },
  { up: ['KeyW'], down: ['KeyS'], left: ['KeyA'], right: ['KeyD'], use: ['KeyQ', 'ShiftLeft', 'Tab'], horn: ['KeyE'] }
];
// with only one player, either side of the keyboard drives the car
function held(p, act) {
  const sets = save.players === 1 && p === 0 ? [CTRL[0], CTRL[1]] : [CTRL[p]];
  return sets.some(c => c[act].some(k => keys[k]));
}
function isAct(code, p, act) {
  const sets = save.players === 1 && p === 0 ? [CTRL[0], CTRL[1]] : [CTRL[p]];
  return sets.some(c => c[act].includes(code));
}
addEventListener('keydown', e => {
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Tab', 'Slash'].includes(e.code)) e.preventDefault();
  if (!keys[e.code]) onPress(e.code);
  keys[e.code] = true;
});
addEventListener('keyup', e => { keys[e.code] = false; });
function setMouse(e) {
  const r = cv.getBoundingClientRect();
  mouse.x = (e.clientX - r.left) * W / r.width;
  mouse.y = (e.clientY - r.top) * H / r.height;
}
cv.addEventListener('mousemove', setMouse);
cv.addEventListener('mousedown', e => { setMouse(e); cv.focus(); onClick(); });
cv.addEventListener('contextmenu', e => e.preventDefault());
addEventListener('blur', () => {
  for (const k in keys) keys[k] = false;
  if (state === 'race' || state === 'countdown') { pausedFrom = state; state = 'pause'; }
});

// ---------- sound (made with code, no files needed) ----------
let actx = null, muted = false, noiseBuf = null, sfxCd = {};
function audioInit() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { } }
  if (actx && actx.state === 'suspended') actx.resume();
}
function tone(freq, dur, type = 'square', vol = 0.08, slideTo = null, delay = 0) {
  if (!actx || muted) return;
  const t = actx.currentTime + delay;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, vol = 0.15, freq = 800, delay = 0) {
  if (!actx || muted) return;
  if (!noiseBuf) {
    noiseBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  const t = actx.currentTime + delay;
  const s = actx.createBufferSource(); s.buffer = noiseBuf;
  const f = actx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = freq;
  const g = actx.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(actx.destination); s.start(t); s.stop(t + dur);
}
function throttled(name, gap) {
  const now = performance.now();
  if (sfxCd[name] && now - sfxCd[name] < gap) return false;
  sfxCd[name] = now; return true;
}
// every vehicle has its own horn
const HORNS = {
  racer()  { tone(660, 0.12, 'square', 0.07); tone(880, 0.16, 'square', 0.07, null, 0.15); },
  gold()   { [988, 1319, 1568, 1976].forEach((f, i) => tone(f, 0.12, 'triangle', 0.07, null, i * 0.06)); tone(880, 0.2, 'square', 0.05, null, 0.28); },
  roar()   { tone(90, 0.7, 'sawtooth', 0.12, 45); noise(0.6, 0.16, 260); },
  siren()  { for (let i = 0; i < 4; i++) tone(i % 2 ? 700 : 950, 0.24, 'triangle', 0.08, null, i * 0.24); },
  fire()   { tone(550, 0.45, 'sawtooth', 0.05, 1050); tone(1050, 0.45, 'sawtooth', 0.05, 550, 0.45); },
  beep()   { for (let i = 0; i < 3; i++) tone(1040, 0.13, 'square', 0.06, null, i * 0.22); },
  jingle() { [784, 659, 784, 880, 784, 659, 523].forEach((f, i) => tone(f, 0.15, 'sine', 0.1, null, i * 0.13)); }
};
const SFX = {
  click() { tone(800, 0.05, 'square', 0.05); },
  beep(hi) { tone(hi ? 1046 : 523, hi ? 0.5 : 0.22, 'square', 0.07); },
  pickup() { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.1, 'square', 0.05, null, i * 0.06)); },
  star() { if (throttled('star', 50)) { tone(1320, 0.08, 'square', 0.04); tone(1760, 0.12, 'square', 0.04, null, 0.06); } },
  whoosh() { if (throttled('whoosh', 120)) { noise(0.45, 0.12, 2200); tone(300, 0.4, 'sawtooth', 0.04, 900); } },
  splat() { noise(0.25, 0.18, 600); tone(200, 0.25, 'sine', 0.1, 60); },
  spin() { if (throttled('spin', 100)) tone(900, 0.5, 'triangle', 0.07, 200); },
  bump() { if (throttled('bump', 120)) { noise(0.1, 0.1, 700); tone(120, 0.1, 'sine', 0.1); } },
  pop() { tone(1200, 0.08, 'sine', 0.1, 300); noise(0.08, 0.08, 3000); },
  shield() { tone(400, 0.3, 'sine', 0.08, 900); },
  star2() { [1047, 1319, 1568, 2093, 1568, 2093].forEach((f, i) => tone(f, 0.1, 'triangle', 0.06, null, i * 0.07)); },
  finish() { [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => tone(f, 0.2, 'square', 0.06, null, i * 0.13)); },
  unlock() { [784, 988, 1175, 1568].forEach((f, i) => tone(f, 0.2, 'triangle', 0.08, null, i * 0.1)); }
};
// engine hum for the players' cars
const engines = [];
function setEngine(i, speed) {
  if (!actx) return;
  if (!engines[i]) {
    const o = actx.createOscillator(), f = actx.createBiquadFilter(), g = actx.createGain();
    o.type = 'sawtooth'; f.type = 'lowpass'; f.frequency.value = 500; g.gain.value = 0;
    o.connect(f); f.connect(g); g.connect(actx.destination); o.start();
    engines[i] = { o, g };
  }
  const e = engines[i], t = actx.currentTime;
  e.o.frequency.setTargetAtTime(55 + Math.abs(speed) * 0.45, t, 0.05);
  e.g.gain.setTargetAtTime(muted || speed === null ? 0 : 0.018 + Math.min(0.02, Math.abs(speed) / 12000), t, 0.08);
}
function quietEngines() { for (let i = 0; i < engines.length; i++) setEngine(i, null); }

// =====================================================================
// VEHICLES — add a new one here, then draw it in drawVehicle()
// =====================================================================
const VEH = [
  { id: 'blue',     kind: 'racer',    name: 'BLUE RACECAR',    tag: 'Super speedy!',         body: '#1f6fe0', dark: '#0e3d8c', helmet: '#ffffff', decalCol: '#ffffff', horn: 'racer',  top: 1.06, grass: 0.55, back: 20 },
  { id: 'gold',     kind: 'racer',    name: 'GOLDEN RACECAR',  tag: 'Shiny and super fast!', body: '#f2c230', dark: '#a87b0b', helmet: '#e2262b', decalCol: '#ffffff', horn: 'gold',   top: 1.06, grass: 0.55, back: 20, shiny: true },
  { id: 'monster',  kind: 'monster',  name: 'MONSTER TRUCK',   tag: 'Drives right over grass!', body: '#8e44ad', dark: '#5b2470', decalCol: '#7cf05a', horn: 'roar',   top: 1.0,  grass: 0.95, back: 18 },
  { id: 'police',   kind: 'police',   name: 'POLICE CAR',      tag: 'Wee-woo! Wee-woo!',     body: '#1b2233', dark: '#0a0e18', decalCol: '#3d8fe0', horn: 'siren',  top: 1.03, grass: 0.6,  back: 20 },
  { id: 'fire',     kind: 'fire',     name: 'FIRE TRUCK',      tag: 'Big red ladder!',       body: '#e2262b', dark: '#8f1216', decalCol: '#ffd23f', horn: 'fire',   top: 1.0,  grass: 0.65, back: 25 },
  { id: 'garbage',  kind: 'garbage',  name: 'GARBAGE TRUCK',   tag: 'Beep! Beep! Beep!',     body: '#2f9e55', dark: '#1a6034', decalCol: '#ffffff', horn: 'beep',   top: 1.0,  grass: 0.65, back: 27 },
  { id: 'icecream', kind: 'icecream', name: 'ICE CREAM TRUCK', tag: 'Yummy treats!',         body: '#ff8fc8', dark: '#c4508f', decalCol: '#ffffff', horn: 'jingle', top: 1.0,  grass: 0.6,  back: 21 },
];
const VID = {}; VEH.forEach((v, i) => { VID[v.id] = v; v.index = i; });

// stickers you unlock by collecting ⭐ stars
const DECALS = [
  { id: 'none',      name: 'Plain',          need: 0 },
  { id: 'stripes',   name: 'Racing Stripes', need: 0 },
  { id: 'flames',    name: 'Flames',         need: 10 },
  { id: 'lightning', name: 'Lightning',      need: 25 },
  { id: 'dots',      name: 'Polka Dots',     need: 40 },
  { id: 'stars',     name: 'Stars',          need: 60 },
  { id: 'rainbow',   name: 'Rainbow',        need: 90 },
];
const DID = {}; DECALS.forEach((d, i) => { DID[d.id] = d; d.index = i; });
const decalOpen = d => save.stars >= d.need;

// prizes from the ? boxes
const ITEMS = {
  turbo:  { icon: '🚀', name: 'TURBO ROCKET',  color: '#ff7a1a' },
  slime:  { icon: '🟢', name: 'SLIME SPLAT',   color: '#5fd35f' },
  shield: { icon: '🫧', name: 'BUBBLE SHIELD', color: '#7fd8ff' },
  star:   { icon: '🌟', name: 'SUPER STAR',    color: '#ffd23f' },
  honk:   { icon: '📣', name: 'MEGA HONK',     color: '#ff4f8b' },
};
const ITEM_KEYS = Object.keys(ITEMS);

// =====================================================================
// TRACKS — the road goes through the points, in order (clockwise).
// The first point is the start/finish line.
// pads = speed boost pads, boxes = ? prize boxes, f = how far around (0 to 1)
// =====================================================================
const HW = 46; // half the road width
const TRACKS = [
  { name: 'Sunny Meadow', theme: 'meadow',
    pts: [[480, 118], [760, 118], [860, 200], [872, 330], [820, 470], [680, 532], [480, 542], [280, 532], [140, 470], [88, 330], [100, 200], [200, 118]],
    pads: [{ f: 0.16, d: 0 }, { f: 0.62, d: 0.45 }, { f: 0.9, d: -0.4 }], boxes: [0.3, 0.78], stars: 16 },
  { name: 'Sandy Beach', theme: 'beach',
    pts: [[470, 115], [740, 115], [870, 205], [862, 380], [770, 525], [630, 548], [540, 470], [440, 448], [340, 520], [200, 535], [98, 420], [98, 230], [220, 118]],
    pads: [{ f: 0.12, d: 0 }, { f: 0.47, d: -0.4 }, { f: 0.83, d: 0.3 }], boxes: [0.28, 0.66], stars: 16 },
  { name: 'Snowy Mountain', theme: 'snow',
    pts: [[480, 545], [230, 545], [100, 455], [96, 230], [190, 120], [335, 118], [480, 285], [625, 118], [770, 120], [864, 230], [860, 455], [730, 545]],
    pads: [{ f: 0.08, d: 0 }, { f: 0.62, d: 0 }, { f: 0.86, d: -0.4 }], boxes: [0.3, 0.75], stars: 18 },
  { name: 'Candy Land', theme: 'candy',
    pts: [[480, 112], [650, 150], [800, 112], [882, 240], [805, 340], [872, 470], [760, 552], [600, 505], [480, 555], [340, 505], [190, 552], [86, 455], [158, 335], [80, 222], [168, 112], [320, 150]],
    pads: [{ f: 0.05, d: 0 }, { f: 0.38, d: 0.3 }, { f: 0.7, d: -0.3 }], boxes: [0.2, 0.55, 0.85], stars: 20 },
  { name: 'Moon Base', theme: 'moon',
    pts: [[250, 112], [380, 122], [480, 240], [580, 122], [710, 112], [852, 182], [862, 335], [745, 455], [600, 545], [480, 562], [360, 545], [215, 455], [98, 335], [108, 182]],
    pads: [{ f: 0.1, d: 0 }, { f: 0.45, d: 0.35 }, { f: 0.68, d: -0.35 }, { f: 0.9, d: 0 }], boxes: [0.26, 0.58, 0.82], stars: 20 },
];

const STEP = 4;
function catmull(p0, p1, p2, p3, t) {
  const t2 = t * t, t3 = t2 * t;
  const f = (a, b, c, d) => 0.5 * ((2 * b) + (-a + c) * t + (2 * a - 5 * b + 4 * c - d) * t2 + (-a + 3 * b - 3 * c + d) * t3);
  return [f(p0[0], p1[0], p2[0], p3[0]), f(p0[1], p1[1], p2[1], p3[1])];
}
function buildTrack(def) {
  const P = def.pts, n = P.length, raw = [];
  for (let i = 0; i < n; i++) {
    const p0 = P[(i - 1 + n) % n], p1 = P[i], p2 = P[(i + 1) % n], p3 = P[(i + 2) % n];
    for (let k = 0; k < 60; k++) raw.push(catmull(p0, p1, p2, p3, k / 60));
  }
  // even spacing every STEP pixels
  const xs = [raw[0][0]], ys = [raw[0][1]];
  let px = raw[0][0], py = raw[0][1], need = STEP;
  for (let i = 1; i <= raw.length; i++) {
    const q = raw[i % raw.length];
    let seg = Math.hypot(q[0] - px, q[1] - py);
    while (seg >= need) {
      const t = need / seg;
      px += (q[0] - px) * t; py += (q[1] - py) * t;
      xs.push(px); ys.push(py);
      seg -= need; need = STEP;
    }
    need -= seg; px = q[0]; py = q[1];
  }
  while (xs.length > 2 && Math.hypot(xs[xs.length - 1] - xs[0], ys[ys.length - 1] - ys[0]) < STEP * 0.6) { xs.pop(); ys.pop(); }
  const N = xs.length, tx = [], ty = [];
  for (let i = 0; i < N; i++) {
    const a = (i - 1 + N) % N, b = (i + 1) % N;
    const dx = xs[b] - xs[a], dy = ys[b] - ys[a], d = Math.hypot(dx, dy) || 1;
    tx.push(dx / d); ty.push(dy / d);
  }
  const tr = { def, xs, ys, tx, ty, N, L: N * STEP };
  tr.pads = def.pads.map(p => ({ s: p.f * tr.L, d: p.d * HW }));
  tr.bg = renderTrack(tr);
  return tr;
}
function trackAt(tr, s) {
  s = ((s % tr.L) + tr.L) % tr.L;
  const f = s / STEP, i = Math.floor(f) % tr.N, j = (i + 1) % tr.N, t = f - Math.floor(f);
  const tx = lerp(tr.tx[i], tr.tx[j], t), ty = lerp(tr.ty[i], tr.ty[j], t), d = Math.hypot(tx, ty) || 1;
  return { x: lerp(tr.xs[i], tr.xs[j], t), y: lerp(tr.ys[i], tr.ys[j], t), tx: tx / d, ty: ty / d, nx: -ty / d, ny: tx / d };
}
function nearestIdx(tr, x, y, hint) {
  let best = -1, bd = Infinity;
  const scan = (a, b) => {
    for (let k = a; k <= b; k++) {
      const i = ((k % tr.N) + tr.N) % tr.N, dx = tr.xs[i] - x, dy = tr.ys[i] - y, d = dx * dx + dy * dy;
      if (d < bd) { bd = d; best = i; }
    }
  };
  if (hint != null) scan(hint - 70, hint + 70);
  if (hint == null || bd > (HW + 90) ** 2) { bd = Infinity; scan(0, tr.N - 1); }
  return best;
}
// where a spot is on the track: how far around (s) and how far from the middle (d)
function locate(tr, x, y, hint) {
  const i = nearestIdx(tr, x, y, hint);
  const dx = x - tr.xs[i], dy = y - tr.ys[i];
  const along = dx * tr.tx[i] + dy * tr.ty[i];
  const d = dx * -tr.ty[i] + dy * tr.tx[i];
  return { i, s: ((i * STEP + along) % tr.L + tr.L) % tr.L, d };
}
function distToRoad(tr, x, y) {
  let bd = Infinity;
  for (let i = 0; i < tr.N; i += 2) { const dx = tr.xs[i] - x, dy = tr.ys[i] - y; bd = Math.min(bd, dx * dx + dy * dy); }
  return Math.sqrt(bd);
}

// ---------- drawing the scenery for each track (done once) ----------
const THEMES = {
  meadow: { ground: ['#5cb85c', '#3f9a47'], road: '#5b5f6b', line: '#f4f4f4', curbA: '#e2262b', curbB: '#ffffff' },
  beach:  { ground: ['#f3dc9b', '#e2c27a'], road: '#6d6873', line: '#fff6cf', curbA: '#1f8fe0', curbB: '#ffffff' },
  snow:   { ground: ['#eef6ff', '#cfe3f5'], road: '#7d8ea6', line: '#ffffff', curbA: '#e2262b', curbB: '#ffffff' },
  candy:  { ground: ['#ffc7e3', '#f7a6cf'], road: '#7a4a2b', line: '#ffe1f0', curbA: '#ff3b7a', curbB: '#ffffff' },
  moon:   { ground: ['#2b2350', '#17122e'], road: '#3b3370', line: '#c9b8ff', curbA: '#ff4fd8', curbB: '#4fe0ff' },
};
function roadPath(c, tr) {
  c.beginPath(); c.moveTo(tr.xs[0], tr.ys[0]);
  for (let i = 1; i < tr.N; i++) c.lineTo(tr.xs[i], tr.ys[i]);
  c.closePath();
}
function renderTrack(tr) {
  const th = THEMES[tr.def.theme];
  const cnv = document.createElement('canvas'); cnv.width = W; cnv.height = H;
  const c = cnv.getContext('2d');
  // ground
  const g = c.createRadialGradient(W / 2, H / 2, 100, W / 2, H / 2, 640);
  g.addColorStop(0, th.ground[0]); g.addColorStop(1, th.ground[1]);
  c.fillStyle = g; c.fillRect(0, 0, W, H);
  // scenery, kept away from the road
  const spots = [];
  const free = (x, y, r) => distToRoad(tr, x, y) > HW + 14 + r && spots.every(s => Math.hypot(s[0] - x, s[1] - y) > s[2] + r + 4);

function updateRace(dt) {

    if (code === 'Digit1') { save.players = 1; writeSave(); SFX.click(); }
    if (code === 'Digit2') { save.players = 2; writeSave(); SFX.click(); }
    if (go) { SFX.click(); toSelect(); }
  } else if (state === 'select') {
    if (code === 'Escape') { toTitle(); return; }

      if (picks[p].ready) { if (isAct(code, p, 'down') && save.players === 2) { picks[p].ready = false; SFX.click(); } continue; }
      if (isAct(code, p, 'left')) changeCar(p, -1);

      if (isAct(code, p, 'down')) changeDecal(p, -1);

    }

    if (code === 'ArrowRight' || code === 'KeyD') { trackSel = Math.min(tracks.length - 1, trackSel + 1); SFX.click(); }

    }

    if (code === 'KeyP' || code === 'Escape') { pausedFrom = state; state = 'pause'; quietEngines(); return; }
    for (const r of racers) if (r.human) {
      const p = r.human - 1;
      if (state === 'race' && isAct(code, p, 'use')) useOrNitro(r);
      const honk = isAct(code, p, 'horn') || (r.mode === 'little' && isAct(code, p, 'down'));
      if (honk && r.honkCd <= 0) { HORNS[VID[r.veh].horn](); r.honkCd = 0.6; popText(r.x, r.y - 24, 'HONK!', '#fff', 18); }
    }
  } else if (state === 'pause') {
    if (code === 'KeyP' || code === 'Escape' || go) state = pausedFrom;
  } else if (state === 'results') {

}

let lastT = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
  update(dt); draw();
  requestAnimationFrame(frame);
}
function update(dt) {
  T += dt; stateT += dt;
  shake = Math.max(0, shake - 30 * dt);
  if (state === 'countdown') {
    const before = Math.ceil(countT);
    countT -= dt;
    const after = Math.ceil(countT);
    if (after !== before && after >= 1 && after <= 3) SFX.beep(false);
    if (countT <= 0) { state = 'race'; SFX.beep(true); }
    updateRace(dt);
  } else if (state === 'race' || state === 'title') {
    updateRace(dt);
  }
  if (state === 'pause') return;
  for (const p of parts) {
    p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
    if (p.kind === 'confetti') { p.rot += p.vr * dt; p.vx += Math.sin(T * 3 + p.y / 40) * 30 * dt; }
    else { p.vx *= 0.92; p.vy *= 0.92; }
  }
  parts = parts.filter(p => p.life > 0 && p.y < H + 20);
  for (const t of texts) { t.life -= dt; t.y -= 30 * dt; }
  texts = texts.filter(t => t.life > 0);
  for (const r of rings) { r.life -= dt; r.r += (r.max - r.r) * Math.min(1, dt * 9); }
  rings = rings.filter(r => r.life > 0);
}

function drawRacer(r) {
  const v = VID[r.veh];
  ctx.save(); ctx.translate(r.x, r.y);
  const sc = r.starT > 0 ? 1.35 : 1;
  ctx.fillStyle = 'rgba(0,0,0,0.28)'; ctx.beginPath(); ctx.ellipse(3, 5, 22 * sc, 13 * sc, r.ang, 0, 7); ctx.fill();
  ctx.rotate(r.ang + r.spinAng); ctx.scale(sc, sc);
  if (r.starT > 0) {
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = `hsla(${(T * 600) % 360},100%,60%,0.45)`; ctx.beginPath(); ctx.ellipse(0, 0, 30, 20, 0, 0, 7); ctx.fill(); ctx.restore();
  }
  drawVehicle(r.veh, r.decal, T + r.x * 0.01);
  ctx.restore();
  if (r.shieldT > 0) {
    ctx.save(); ctx.globalAlpha = r.shieldT < 1.5 && Math.floor(T * 10) % 2 ? 0.3 : 0.75;
    ctx.strokeStyle = '#bfefff'; ctx.lineWidth = 3; circle(r.x, r.y, 27); ctx.stroke();
    ctx.fillStyle = 'rgba(127,216,255,0.18)'; ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.7)'; circle(r.x - 9, r.y - 10, 5); ctx.fill();
    ctx.restore();
  }
}
function drawTag(r) {

  ctx.beginPath(); ctx.moveTo(r.x - 7, y + 8); ctx.lineTo(r.x + 7, y + 8); ctx.lineTo(r.x, y + 16); ctx.closePath(); ctx.fill(); ctx.stroke();
  text(label, r.x, y, 16, col);
  if (r.wrongT > 1) text('↩ WRONG WAY!', r.x, r.y + 34, 16, '#ff6b6b');
}
function drawWorld() {
  ctx.drawImage(tr.bg, 0, 0);
  // boost pads
  for (const pad of tr.pads) {
    const p = trackAt(tr, pad.s);
    ctx.save(); ctx.translate(p.x + p.nx * pad.d, p.y + p.ny * pad.d); ctx.rotate(Math.atan2(p.ty, p.tx));
    ctx.fillStyle = '#0d5b8f'; rr(-20, -16, 40, 32, 6); ctx.fill();
    for (let k = 0; k < 3; k++) {
      const a = 0.45 + 0.55 * ((Math.sin(T * 10 - k * 1.2) + 1) / 2);
      ctx.fillStyle = `rgba(61,240,255,${a})`;
      ctx.beginPath(); ctx.moveTo(-14 + k * 11, -11); ctx.lineTo(-6 + k * 11, 0); ctx.lineTo(-14 + k * 11, 11); ctx.lineTo(-9 + k * 11, 11); ctx.lineTo(-1 + k * 11, 0); ctx.lineTo(-9 + k * 11, -11); ctx.fill();
    }
    ctx.restore();
  }
  // stars
  for (const s of starsOnTrack) if (s.t <= 0) emoji('⭐', s.x, s.y + Math.sin(T * 4 + s.x) * 2, 18);
  // prize boxes
  for (const b of boxes) {
    if (b.t > 0) continue;
    ctx.save(); ctx.translate(b.x, b.y + Math.sin(T * 3 + b.x) * 2); ctx.rotate(Math.sin(T * 2 + b.y) * 0.25);
    ctx.fillStyle = `hsl(${(T * 120 + b.x) % 360},85%,55%)`; ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.5;
    rr(-12, -12, 24, 24, 5); ctx.fill(); ctx.stroke();
    ctx.restore();
    text('?', b.x, b.y + Math.sin(T * 3 + b.x) * 2 + 1, 18, '#fff');
  }
  // slime
  for (const p of puddles) {
    ctx.fillStyle = '#4cc94c'; ctx.beginPath();
    for (let k = 0; k < 10; k++) { const a = k / 10 * Math.PI * 2, rad = 14 + Math.sin(k * 2.3) * 4; ctx.lineTo(p.x + Math.cos(a) * rad, p.y + Math.sin(a) * rad); }
    ctx.fill(); ctx.fillStyle = '#9af09a'; circle(p.x - 4, p.y - 4, 4); ctx.fill();
  }
  // cars, back to front
  const order = racers.slice().sort((a, b) => a.y - b.y);
  for (const r of order) drawRacer(r);
  for (const r of racers) if (r.human && state !== 'title' && state !== 'results') drawTag(r);
}
function drawFx() {
  for (const p of parts) {
    ctx.globalAlpha = Math.max(0, Math.min(1, p.life / p.max * 1.5));
    ctx.fillStyle = p.color;
    if (p.kind === 'confetti') { ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2); ctx.restore(); }
    else if (p.kind === 'spark') { ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillRect(-p.size, -1, p.size * 2, 2); ctx.fillRect(-1, -p.size, 2, p.size * 2); ctx.restore(); }
    else { circle(p.x, p.y, p.size); ctx.fill(); }
  }
  ctx.globalAlpha = 1;
  for (const r of rings) {
    ctx.globalAlpha = r.life / r.maxLife; ctx.strokeStyle = r.color; ctx.lineWidth = 6;
    circle(r.x, r.y, r.r); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  for (const t of texts) {
    if (!t.str) continue;
    ctx.globalAlpha = Math.min(1, t.life * 2.5);
    const pop = 1 + Math.max(0, (t.life - 0.85)) * 3;
    text(t.str, t.x, t.y, t.size * pop, t.color);
  }
  ctx.globalAlpha = 1;
}

function drawCountdown() {

  const x = W / 2, y = H / 2 - 20;

function button(label, x, y, w, h, col, action, size) {

  button('▶ Keep Going', W / 2 - 150, 280, 300, 60, '#3fae4f', () => { state = pausedFrom; });
  button('🔁 Start Over', W / 2 - 150, 360, 300, 60, '#2d6cdf', () => startRace(tracks.indexOf(tr)));
  button('🏠 Main Menu', W / 2 - 150, 440, 300, 60, '#7a4bc4', () => toTitle());
}

function draw() {
  buttons = [];
  ctx.save();
  if (shake > 0) ctx.translate(rand(-shake, shake), rand(-shake, shake));
  if (state === 'title') drawTitle();
  else if (state === 'select') drawSelect();
  else if (state === 'tracks') drawTracks();
  else if (state === 'results') { drawResults(); drawFx(); }
  else {
    drawWorld(); drawFx(); drawRaceHUD();
    if (state === 'pause') drawPause();
  }
  ctx.restore();
}

setupRace(0, true);
requestAnimationFrame(frame);
</script>
</body>
</html>
