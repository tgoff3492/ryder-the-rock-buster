<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Goff Kid's Arcade</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Trebuchet MS", "Arial Rounded MT Bold", Verdana, sans-serif;
    background: radial-gradient(ellipse at 50% 0%, #3a2470 0%, #160f2e 55%, #0a0716 100%);
    color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100vh; overflow: hidden; user-select: none;
  }
  /* twinkly stars */
  .sky { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  h1, .sub, .games, .help { position: relative; z-index: 1; }
  .sky i { position: absolute; width: 3px; height: 3px; border-radius: 50%; background: #fff; animation: tw 2.4s infinite ease-in-out; }
  @keyframes tw { 0%, 100% { opacity: .2 } 50% { opacity: 1 } }

  h1 {
    margin: 0 0 6px; font-size: clamp(40px, 7vw, 84px); font-weight: 900; letter-spacing: 2px; text-align: center;
    color: #ffd23f; -webkit-text-stroke: 3px #1a0f2e; paint-order: stroke fill;
    text-shadow: 0 0 18px #ff4fd8, 0 0 40px #ff4fd8aa, 0 6px 0 #1a0f2e;
    animation: glow 2s infinite alternate;
  }
  @keyframes glow { to { text-shadow: 0 0 26px #4fe0ff, 0 0 52px #4fe0ffaa, 0 6px 0 #1a0f2e; } }
  .sub { font-size: clamp(16px, 2vw, 22px); font-weight: 900; color: #c9b8ff; margin-bottom: 28px; }

  .games { display: flex; gap: clamp(16px, 3vw, 40px); flex-wrap: wrap; justify-content: center; padding: 0 16px; }
  .game {
    width: min(420px, 42vw); min-width: 280px; border-radius: 22px; padding: 14px 14px 18px; text-decoration: none; color: #fff;
    background: #241a46; border: 5px solid #3d2f72; box-shadow: 0 10px 0 #0c0820, 0 14px 30px #0008;
    transition: transform .15s, border-color .15s, box-shadow .15s; cursor: pointer; text-align: center; display: block;
  }
  .game img { width: 100%; aspect-ratio: 3 / 2; object-fit: cover; border-radius: 14px; display: block; border: 3px solid #0c0820; }
  .game .name { font-size: clamp(24px, 2.6vw, 32px); font-weight: 900; margin-top: 12px; -webkit-text-stroke: 1.5px #0c0820; paint-order: stroke fill; }
  .game .who { font-size: 17px; font-weight: 900; color: #c9b8ff; margin-top: 4px; }
  .game .play {
    display: inline-block; margin-top: 12px; padding: 10px 30px; border-radius: 14px; font-size: 22px; font-weight: 900;
    border: 3px solid #0c0820; box-shadow: 0 5px 0 #0c0820;
  }
  .rock .name { color: #ffb05a; } .rock .play { background: #3fae4f; }
  .speed .name { color: #4fd0ff; } .speed .play { background: #ff7a1a; }
  .game.sel, .game:hover { transform: translateY(-10px) scale(1.03); }
  .rock.sel, .rock:hover { border-color: #ffd23f; box-shadow: 0 10px 0 #0c0820, 0 0 40px #ffd23f88; }
  .speed.sel, .speed:hover { border-color: #4fe0ff; box-shadow: 0 10px 0 #0c0820, 0 0 40px #4fe0ff88; }
  .game.sel .play { animation: bob .6s infinite alternate; }
  @keyframes bob { to { transform: scale(1.08); } }

  .help { margin-top: 30px; font-size: 18px; font-weight: 900; color: #fff; opacity: .85; text-align: center; }
  kbd { background: #fff; color: #160f2e; border-radius: 6px; padding: 2px 8px; border-bottom: 3px solid #9a8fc4; font-family: inherit; }
</style>
</head>
<body>
<div class="sky" id="sky"></div>
<h1>GOFF KID'S ARCADE</h1>
<div class="sub">🕹️ Pick a game! 🕹️</div>

<div class="games">
  <a class="game rock sel" href="rock-buster/index.html">
    <img src="images/rock-buster.jpg" alt="Ryder the Rock Buster title screen">
    <div class="name">RYDER THE ROCK BUSTER</div>
    <div class="who">A game by RJ 🪨💥</div>
    <div class="play">▶ PLAY</div>
  </a>
  <a class="game speed" href="super-speeder/index.html">
    <img src="images/super-speeder.jpg" alt="Weston Super Speeder title screen">
    <div class="name">WESTON SUPER SPEEDER</div>
    <div class="who">Weston's racing game 🏎️💨</div>
    <div class="play">▶ PLAY</div>
  </a>
</div>

<div class="help"><kbd>←</kbd> <kbd>→</kbd> pick a game &nbsp;&nbsp; <kbd>SPACE</kbd> play!</div>

<script>
  // twinkly stars
  const sky = document.getElementById('sky');
  for (let i = 0; i < 70; i++) {
    const s = document.createElement('i');
    s.style.left = Math.random() * 100 + '%'; s.style.top = Math.random() * 100 + '%';
    s.style.animationDelay = (Math.random() * 2.4) + 's';
    sky.appendChild(s);
  }
  // arrow keys + SPACE, same as the games
  const cards = [...document.querySelectorAll('.game')];
  let sel = 0;
  try { sel = +(sessionStorage.getItem('arcade_sel') || 0) % cards.length; } catch (e) { }
  function show() { cards.forEach((c, i) => c.classList.toggle('sel', i === sel)); try { sessionStorage.setItem('arcade_sel', sel); } catch (e) { } }
  let actx = null;
  function blip(f) {
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;
      o.type = 'square'; o.frequency.value = f; g.gain.setValueAtTime(0.06, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.1);
      o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + 0.12);
    } catch (e) { }
  }
  addEventListener('keydown', e => {
    if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space'].includes(e.code)) e.preventDefault();
    if (e.code === 'ArrowLeft' || e.code === 'ArrowUp' || e.code === 'KeyA') { sel = (sel + cards.length - 1) % cards.length; show(); blip(660); }
    if (e.code === 'ArrowRight' || e.code === 'ArrowDown' || e.code === 'KeyD') { sel = (sel + 1) % cards.length; show(); blip(660); }
    if (e.code === 'Space' || e.code === 'Enter') { blip(990); setTimeout(() => { location.href = cards[sel].getAttribute('href'); }, 120); }
  });
  cards.forEach((c, i) => c.addEventListener('mouseenter', () => { sel = i; show(); }));
  show();
</script>
</body>
</html>
