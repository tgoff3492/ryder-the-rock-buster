<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ryder the Rock Buster</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; background: #1b1410; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; box-shadow: 0 0 40px #000; border-radius: 10px; outline: none; }
</style>
</head>
<body>
<canvas id="game" width="960" height="640" tabindex="0"></canvas>
<script>
'use strict';
/* =====================================================================
   RYDER THE ROCK BUSTER  —  game idea by RJ
   Arrow keys = move, SPACE = shoot (the game aims for you!)
   ===================================================================== */

const W = 960, H = 640;
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const FONT = '"Trebuchet MS","Arial Rounded MT Bold",Verdana,sans-serif';
const EFONT = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';

function fit() {
  const s = Math.min(innerWidth / W, innerHeight / H) * 0.98;
  cv.style.width = (W * s) + 'px';
  cv.style.height = (H * s) + 'px';
}
addEventListener('resize', fit); fit();
cv.focus();

// ---------- little helpers ----------
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const d2 = (ax, ay, bx, by) => { const dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; };
function weighted(mix) {
  let tot = 0; for (const k in mix) tot += mix[k];
  let r = Math.random() * tot;
  for (const k in mix) { r -= mix[k]; if (r <= 0) return k; }
  return Object.keys(mix)[0];
}
function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.closePath();
}
function text(str, x, y, size, color = '#fff', align = 'center', stroke = '#1a0f08') {
  ctx.font = `900 ${size}px ${FONT}`;
  ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  ctx.lineWidth = Math.max(3, size / 5); ctx.strokeStyle = stroke;
  ctx.strokeText(str, x, y); ctx.fillStyle = color; ctx.fillText(str, x, y);
}
function emoji(e, x, y, size, alpha = 1) {
  ctx.save(); ctx.globalAlpha *= alpha;
  ctx.font = `${size}px ${EFONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#fff'; ctx.fillText(e, x, y); ctx.restore();
}

// ---------- input ----------
const keys = {};
const mouse = { x: W / 2, y: H / 2, down: false };
let aimMode = 'key';          // 'key' = auto-aim with SPACE, 'mouse' = aim at the pointer
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if ([' ', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(k)) e.preventDefault();
  if (!keys[k]) onPress(k);
  keys[k] = true;
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
function setMouse(e) {
  const r = cv.getBoundingClientRect();
  mouse.x = (e.clientX - r.left) * W / r.width;
  mouse.y = (e.clientY - r.top) * H / r.height;
}
cv.addEventListener('mousemove', setMouse);
cv.addEventListener('mousedown', e => { setMouse(e); mouse.down = true; cv.focus(); onClick(); });
addEventListener('mouseup', () => { mouse.down = false; });
cv.addEventListener('contextmenu', e => e.preventDefault());
addEventListener('blur', () => {
  for (const k in keys) keys[k] = false;
  mouse.down = false;
  if (state === 'play') state = 'pause';
});

// ---------- sound (made with code, no files needed) ----------
let actx = null, muted = false, noiseBuf = null, sfxCd = {};
function audioInit() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { } }
  if (actx && actx.state === 'suspended') actx.resume();
}
function tone(freq, dur, type = 'square', vol = 0.08, slideTo = null, delay = 0) {
  if (!actx || muted) return;
  const t = actx.currentTime + delay;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, vol = 0.15, freq = 800, delay = 0) {
  if (!actx || muted) return;
  if (!noiseBuf) {
    noiseBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  const t = actx.currentTime + delay;
  const s = actx.createBufferSource(); s.buffer = noiseBuf;
  const f = actx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = freq;
  const g = actx.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(actx.destination); s.start(t); s.stop(t + dur);
}
function throttled(name, gap) {
  const now = performance.now();
  if (sfxCd[name] && now - sfxCd[name] < gap) return false;
  sfxCd[name] = now; return true;
}
const SFX = {
  shoot() {
    const f = 520 + gun.power * 70;
    if (gun.sp.zap) tone(f * 1.6, 0.07, 'sawtooth', 0.025, f * 0.5);
    else if (gun.sp.rainbow) tone(f * 1.3, 0.08, 'triangle', 0.05, f * 2);
    else tone(f, 0.07, 'square', 0.03, f * 0.4);
    if (gun.sp.rocket) noise(0.1, 0.04, 1500);
  },
  hit() { if (throttled('hit', 45)) noise(0.06, 0.07, 1600); },
  crunch(big) { if (!throttled('crunch', 40)) return; noise(big ? 0.45 : 0.22, 0.2, big ? 450 : 900); tone(big ? 90 : 150, 0.2, 'triangle', 0.1, 40); },
  pickup() { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.12, 'square', 0.05, null, i * 0.07)); },
  heal() { tone(660, 0.1, 'sine', 0.1); tone(990, 0.18, 'sine', 0.1, null, 0.09); },
  hurt() { tone(320, 0.35, 'sawtooth', 0.08, 80); },
  clear() { [523, 659, 784, 659, 784, 1047].forEach((f, i) => tone(f, 0.18, 'square', 0.06, null, i * 0.12)); },
  boom() { if (!throttled('boom', 70)) return; noise(0.35, 0.2, 420); tone(130, 0.3, 'sine', 0.14, 40); },
  zap() { if (throttled('zap', 60)) tone(1300, 0.09, 'sawtooth', 0.03, 300); },
  roar() { tone(110, 0.7, 'sawtooth', 0.09, 50); noise(0.6, 0.12, 300); },
  lose() { [392, 330, 262, 196].forEach((f, i) => tone(f, 0.25, 'triangle', 0.09, null, i * 0.18)); },
  win() { [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => tone(f, 0.22, 'square', 0.06, null, i * 0.14)); },
  click() { tone(800, 0.05, 'square', 0.05); }
};

// ---------- upgrades ----------
const UP = {
  power:   { icon: '💪', color: '#ff4d4d', name: 'MEGA POWER',    desc: 'Bigger bullets, more damage!' },
  rapid:   { icon: '⏩', color: '#ffb000', name: 'RAPID FIRE',    desc: 'Shoot faster!' },
  triple:  { icon: '🔱', color: '#4fe06a', name: 'TRIPLE SHOT',   desc: 'Three bullets at once!' },
  fire:    { icon: '🔥', color: '#ff7a1a', name: 'FIRE BLAST',    desc: 'Bullets set rocks on fire!' },
  ice:     { icon: '❄️', color: '#5fdcff', name: 'ICE BEAM',      desc: 'Frozen rocks move super slow!' },
  zap:     { icon: '⚡', color: '#b98cff', name: 'LIGHTNING',     desc: 'Zaps jump to other rocks!' },
  rocket:  { icon: '🚀', color: '#ff4f8b', name: 'ROCKETS',       desc: 'Every shot goes BOOM!' },
  rainbow: { icon: '🌈', color: '#ffffff', name: 'RAINBOW LASER', desc: 'Shots go right through rocks!' },
  heart:   { icon: '❤️', color: '#ff3b5c', name: 'HEART',         desc: 'Health back!' },
};
const SPECIALS = ['triple', 'fire', 'ice', 'zap', 'rocket', 'rainbow'];
const COLOR_SPECIALS = ['fire', 'ice', 'zap', 'rocket'];
let gun;
function newGun() { gun = { power: 1, rapid: 1, sp: {}, last: null }; }
newGun();
function gunColor() {
  if (gun.last === 'rainbow') return `hsl(${(T * 300) % 360},100%,60%)`;
  if (gun.last) return UP[gun.last].color;
  return '#8d99ab';
}
function specialCount() { return SPECIALS.filter(s => gun.sp[s]).length; }

// ---------- monsters ----------
const MT = {
  pebble:  { r: 13, hp: 2,  spd: 72, col: '#a39a90', dark: '#625a52', score: 10 },
  rock:    { r: 21, hp: 6,  spd: 54, col: '#8f8273', dark: '#564b41', score: 25 },
  boulder: { r: 32, hp: 15, spd: 38, col: '#7d7064', dark: '#4a4139', score: 50, split: true },
  lava:    { r: 21, hp: 8,  spd: 50, col: '#5a3a33', dark: '#2e1c18', score: 40, lava: true, thrower: true },
  crystal: { r: 18, hp: 7,  spd: 92, col: '#9a78e0', dark: '#4e348f', score: 40, crystal: true },
  king:    { r: 64, hp: 160, spd: 30, col: '#7a6d62', dark: '#3f3730', score: 1000, boss: true },
};

// ---------- levels ----------
const LEVELS = [
  { name: 'Pebble Park',         theme: 'grass',  ground: '#5d8f45', count: 10, mix: { pebble: 7, rock: 3 }, maxAlive: 4, drops: 3 },
  { name: 'Rocky Road',          theme: 'dirt',   ground: '#9a7b52', count: 14, mix: { pebble: 5, rock: 5 }, maxAlive: 5, drops: 2 },
  { name: 'Boulder Hills',       theme: 'grass',  ground: '#6a8a40', count: 15, mix: { pebble: 4, rock: 4, boulder: 2 }, maxAlive: 5, drops: 2 },
  { name: 'Lava Land',           theme: 'lava',   ground: '#3d2b26', count: 17, mix: { pebble: 3, rock: 4, lava: 3 }, maxAlive: 6, drops: 2 },
  { name: "Rock King's Castle",  theme: 'castle', ground: '#5d5a63', count: 10, mix: { pebble: 6, rock: 4 }, maxAlive: 4, drops: 1, boss: { hp: 160, ring: 8, cd: 4.6 } },
  { name: 'Crystal Caves',       theme: 'cave',   ground: '#2f2a44', count: 20, mix: { pebble: 3, rock: 3, crystal: 4 }, maxAlive: 7, drops: 2 },
  { name: "Giant's Canyon",      theme: 'dirt',   ground: '#a0663f', count: 20, mix: { rock: 4, boulder: 3, crystal: 2 }, maxAlive: 7, drops: 2 },
  { name: 'Volcano',             theme: 'lava',   ground: '#2e1f1c', count: 22, mix: { rock: 3, lava: 4, boulder: 3 }, maxAlive: 8, drops: 2 },
  { name: 'Stone Storm',         theme: 'dirt',   ground: '#7d7368', count: 26, mix: { pebble: 3, rock: 3, boulder: 2, lava: 2, crystal: 2 }, maxAlive: 9, drops: 2 },
  { name: 'The Rock King Returns', theme: 'castle', ground: '#4a4652', count: 14, mix: { pebble: 4, rock: 3, crystal: 2, lava: 1 }, maxAlive: 6, drops: 1, boss: { hp: 300, ring: 12, cd: 4.0, big: true } },
];

// ---------- game state ----------
let state = 'title';          // title | play | pause | dead | win
let easy = true;              // Kid Mode
let score = 0, best = 0, T = 0, shake = 0;
try { best = +localStorage.getItem('ryder_best') || 0; } catch (e) { }
let levelIdx = 0, lvl = null, bg = null, phase = 'intro', phaseT = 0, toSpawn = 0, spawnT = 0, kills = 0, dropPlan = new Set(), deadT = 0;
let player, monsters = [], bullets = [], erocks = [], pickups = [], parts = [], rings = [], bolts = [], texts = [];
let banner = null, nextId = 1, buttons = [];
let titleBg = null, titleRocks = [];

const speedMul = () => easy ? 0.78 : 1.05;
const maxHp = () => easy ? 6 : 4;
function saveBest() { if (score > best) { best = score; try { localStorage.setItem('ryder_best', best); } catch (e) { } } }

function resetPlayer() {
  player = { x: W / 2, y: H / 2 + 60, r: 16, hp: maxHp(), inv: 0, ang: -Math.PI / 2, moveAng: -Math.PI / 2, cd: 0, flash: 0, walk: 0, kx: 0, ky: 0 };
}

function startGame() {
  score = 0; newGun(); startLevel(0); state = 'play';
}
function startLevel(i) {
  levelIdx = i; lvl = LEVELS[i]; bg = makeBg(lvl);
  monsters = []; bullets = []; erocks = []; pickups = []; parts = []; rings = []; bolts = []; texts = [];
  banner = null; resetPlayer();
  toSpawn = lvl.count; spawnT = 0.4; kills = 0;
  dropPlan = new Set();
  for (let k = 1; k <= lvl.drops; k++) dropPlan.add(Math.max(1, Math.round(lvl.count * k / (lvl.drops + 1))));
  phase = 'intro'; phaseT = 2.4;
}

// ---------- spawning ----------
function makeShape(r) {
  const n = randi(9, 12), pts = [];
  for (let i = 0; i < n; i++) {
    const a = i / n * Math.PI * 2 + rand(-0.15, 0.15), rad = r * rand(0.82, 1.08);
    pts.push([Math.cos(a) * rad, Math.sin(a) * rad]);
  }
  return pts;
}
function makeCracks(r) {
  const out = [];
  for (let c = 0; c < 3; c++) {
    let a = rand(0, Math.PI * 2), x = Math.cos(a) * r * 0.15, y = Math.sin(a) * r * 0.15;
    const line = [[x, y]];
    for (let s = 0; s < 3; s++) { a += rand(-0.6, 0.6); x += Math.cos(a) * r * 0.25; y += Math.sin(a) * r * 0.25; line.push([x, y]); }
    out.push(line);
  }
  return out;
}
function edgePos(r) {
  let best = null;
  for (let tries = 0; tries < 6; tries++) {
    const s = randi(0, 3); let p;
    if (s === 0) p = [rand(40, W - 40), -r - 10];
    else if (s === 1) p = [W + r + 10, rand(40, H - 40)];
    else if (s === 2) p = [rand(40, W - 40), H + r + 10];
    else p = [-r - 10, rand(40, H - 40)];
    best = p;
    if (!player || d2(p[0], p[1], player.x, player.y) > 260 * 260) break;
  }
  return best;
}
function spawnMonster(type, x, y) {
  const t = MT[type];
  let r = t.r;
  if (t.boss && lvl.boss && lvl.boss.big) r *= 1.2;
  if (x === undefined) [x, y] = edgePos(r);
  let hp = t.boss ? lvl.boss.hp * (easy ? 0.8 : 1) : t.hp * (1 + levelIdx * 0.1);
  const m = {
    id: nextId++, type, t, x, y, r, hp, maxHp: hp,
    spd: t.spd * speedMul() * (1 + levelIdx * 0.035) * rand(0.9, 1.1),
    shape: makeShape(r), cracks: makeCracks(r), rot: rand(0, 6.28), wob: rand(0, 6.28),
    hitFlash: 0, burn: 0, burnTick: 0, slow: 0, kx: 0, ky: 0, vx: 0, vy: 0,
    throwCd: rand(1.5, 3.5), bossCd: 3, atk: 1, stomp: 0, dead: false
  };
  monsters.push(m);
  return m;
}
function spawnBoss() {
  spawnMonster('king', W / 2, -80);
  SFX.roar(); shake = 10;
  banner = { icon: '👑', name: 'THE ROCK KING!', desc: 'Shoot him lots to smash him!', color: '#ffd23f', t: 0, dur: 2.8 };
}
function throwRock(x, y, a, spd) {
  spd *= easy ? 0.8 : 1;
  erocks.push({ x, y, vx: Math.cos(a) * spd, vy: Math.sin(a) * spd, r: 8, rot: 0, life: 9 });
}

// ---------- effects ----------
function addP(p) {
  if (parts.length > 750) return;
  p.max = p.life; p.rot = p.rot || 0; p.vr = p.vr || 0;
  parts.push(p);
}
function debris(x, y, r, col, dark, n) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, 6.28), s = rand(60, 260);
    addP({ kind: 'chip', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(0.4, 0.9), size: rand(3, 4 + r * 0.25), color: Math.random() < 0.5 ? col : dark, rot: rand(0, 6), vr: rand(-10, 10) });
  }
  for (let i = 0; i < n / 2; i++) {
    const a = rand(0, 6.28), s = rand(20, 80);
    addP({ kind: 'dot', grow: true, x: x + rand(-r, r) * 0.5, y: y + rand(-r, r) * 0.5, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(0.4, 0.8), size: rand(4, 6 + r * 0.2), color: 'rgba(190,180,165,0.5)' });
  }
}
function sparkle(x, y, color, n = 14, spd = 180) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, 6.28), s = rand(spd * 0.4, spd);
    addP({ kind: 'star', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(0.4, 0.8), size: rand(3, 6), color });
  }
}
function confetti() {
  const cols = ['#ff4d4d', '#ffd23f', '#4fe06a', '#5fdcff', '#b98cff', '#ff4f8b'];
  for (let i = 0; i < 120; i++)
    addP({ kind: 'chip', x: rand(0, W), y: rand(-40, 0), vx: rand(-40, 40), vy: rand(120, 320), life: rand(1.6, 2.6), size: rand(5, 9), color: pick(cols), rot: rand(0, 6), vr: rand(-8, 8), nofric: true });
}
function zigzag(x1, y1, x2, y2) {
  const pts = [[x1, y1]], n = 7, dx = x2 - x1, dy = y2 - y1, l = Math.hypot(dx, dy) || 1;
  for (let i = 1; i < n; i++) {
    const t = i / n, off = rand(-14, 14);
    pts.push([x1 + dx * t - dy / l * off, y1 + dy * t + dx / l * off]);
  }
  pts.push([x2, y2]);
  return pts;
}
function popText(x, y, str, color = '#fff', size = 26) {
  texts.push({ x, y, str, color, size, life: 0.9, max: 0.9 });
}

// ---------- shooting ----------
function nearestTarget() {
  let best = null, bd = Infinity, onscreen = false;
  for (const m of monsters) {
    if (m.dead) continue;
    const on = m.x > -5 && m.x < W + 5 && m.y > -5 && m.y < H + 5;
    const d = d2(m.x, m.y, player.x, player.y) * (on ? 1 : 4);
    if (d < bd) { bd = d; best = m; }
  }
  for (const r of erocks) {   // swat away rocks that are about to hit you
    const d = d2(r.x, r.y, player.x, player.y);
    if (d < 140 * 140 && d < bd) { bd = d; best = r; }
  }
  return best;
}
function fire() {
  const p = player;
  p.cd = 0.34 - 0.045 * (gun.rapid - 1);
  const len = 24 + gun.power * 4;
  const ca = Math.cos(p.ang), sa = Math.sin(p.ang);
  const tx = p.x + ca * (len + 4) - sa * 5, ty = p.y + sa * (len + 4) + ca * 5;
  const spread = gun.sp.triple ? [-0.2, 0, 0.2] : [0];
  const fx = Object.assign({}, gun.sp);
  const cols = COLOR_SPECIALS.filter(s => fx[s]).map(s => UP[s].color);
  for (const off of spread) {
    const a = p.ang + off, sp = 560;
    bullets.push({
      x: tx, y: ty, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      r: 4 + gun.power * 0.9 + (fx.rocket ? 2 : 0), dmg: 1 + gun.power,
      life: 1.6, hit: new Set(), hue: rand(0, 360), fx, cols
    });
  }
  p.flash = 0.06;
  const fc = cols[0] || '#fff3a0';
  for (let i = 0; i < 4; i++) addP({ kind: 'spark', x: tx, y: ty, vx: Math.cos(p.ang + rand(-0.6, 0.6)) * rand(150, 300), vy: Math.sin(p.ang + rand(-0.6, 0.6)) * rand(150, 300), life: 0.12, size: 2, color: fc });
  SFX.shoot();
}
function hitMonster(m, b) {
  const f = b.fx;
  addP({ kind: 'glow', x: b.x, y: b.y, vx: 0, vy: 0, life: 0.12, size: b.r * 2.2, color: '#fff6c0' });
  damage(m, b.dmg, b.vx, b.vy);
  if (f.fire) m.burn = 2.6;
  if (f.ice) { m.slow = 2.6; sparkle(b.x, b.y, '#d4f7ff', 5, 120); }
  if (f.zap) chain(m, b.dmg * 0.6);
  if (f.rocket) explode(b.x, b.y, b.dmg * 0.75, m);
  SFX.hit();
}
function damage(m, d, vx, vy) {
  if (m.dead) return;
  m.hp -= d; m.hitFlash = 0.08;
  if (vx !== undefined) {
    const l = Math.hypot(vx, vy) || 1, k = m.t.boss ? 15 : 110 * (13 / m.r);
    m.kx += vx / l * k; m.ky += vy / l * k;
    for (let i = 0; i < 2; i++) addP({ kind: 'chip', x: m.x - vx / l * m.r * 0.8, y: m.y - vy / l * m.r * 0.8, vx: -vx / l * rand(60, 160) + rand(-60, 60), vy: -vy / l * rand(60, 160) + rand(-60, 60), life: 0.4, size: rand(2, 4), color: m.t.col, rot: rand(0, 6), vr: rand(-8, 8) });
  }
  if (m.hp <= 0) killMonster(m);
}
function chain(src, d) {
  const targets = monsters.filter(o => !o.dead && o !== src && d2(o.x, o.y, src.x, src.y) < 175 * 175)
    .sort((a, b) => d2(a.x, a.y, src.x, src.y) - d2(b.x, b.y, src.x, src.y)).slice(0, 2);
  for (const t of targets) {
    bolts.push({ pts: zigzag(src.x, src.y, t.x, t.y), life: 0.2, max: 0.2 });
    damage(t, d);

  }

}
function explode(x, y, d, except) {
  rings.push({ x, y, r: 8, max: 75, life: 0.3, maxLife: 0.3, color: '#ffb347' });
  for (let i = 0; i < 16; i++) {
    const a = rand(0, 6.28), s = rand(40, 220);
    addP({ kind: 'glow', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(0.25, 0.5), size: rand(6, 14), color: pick(['#ff7a1a', '#ffd23f', '#ff4f2a']) });
  }
  for (const m of monsters) if (m !== except && !m.dead && d2(m.x, m.y, x, y) < (75 + m.r) ** 2) damage(m, d);
  shake = Math.max(shake, 5);
  SFX.boom();
}
function killMonster(m, noDrop) {
  if (m.dead) return;
  m.dead = true;
  score += m.t.score;
  const big = m.r > 25;
  debris(m.x, m.y, m.r, m.t.col, m.t.dark, Math.round(8 + m.r / 2));
  if (m.t.lava) sparkle(m.x, m.y, '#ff8a2a', 8, 200);
  if (m.t.crystal) sparkle(m.x, m.y, '#e3ccff', 12, 220);
  shake = Math.max(shake, m.r / 4);
  SFX.crunch(big);
  if (noDrop) return;
  kills++;
  if (big || Math.random() < 0.3) popText(m.x, m.y - m.r, pick(['CRUNCH!', 'SMASH!', 'BAM!', 'POW!', 'KABOOM!']), pick(['#ffd23f', '#ff7a1a', '#5fdcff', '#4fe06a']), big ? 32 : 24);
  if (m.t.split) {
    for (const s of [-1, 1]) {
      const p = spawnMonster('pebble', m.x + s * 12, m.y + rand(-8, 8));

    }
  }
  if (m.t.boss) {
    bossDown(m);
    dropPickup(m.x - 40, m.y, chooseUpgrade());
    dropPickup(m.x + 40, m.y, chooseUpgrade());
    dropPickup(m.x, m.y + 40, 'heart');
    return;
  }
  if (dropPlan.has(kills)) { dropPlan.delete(kills); dropPickup(m.x, m.y, chooseUpgrade()); }
  else if (player.hp < maxHp() && Math.random() < (easy ? 0.1 : 0.06)) dropPickup(m.x, m.y, 'heart');
  else if (Math.random() < 0.03) dropPickup(m.x, m.y, chooseUpgrade());
}
function retryLevel() {
  for (const p of pickups) if (p.type !== 'heart') applyUpgrade(p.type);   // don't lose prizes left on the ground
  startLevel(levelIdx); state = 'play';
}
function bossDown(m) {
  toSpawn = 0;
  for (const o of monsters) if (!o.dead && o !== m) killMonster(o, true);
  erocks = [];
  shake = 18;
  for (let i = 0; i < 4; i++) rings.push({ x: m.x, y: m.y, r: 10 + i * 20, max: 200 + i * 40, life: 0.6, maxLife: 0.6, color: '#ffd23f' });
  debris(m.x, m.y, m.r, m.t.col, m.t.dark, 60);
  sparkle(m.x, m.y, '#ffd23f', 30, 320);
  SFX.boom(); SFX.roar();
  popText(m.x, m.y - 40, 'KA-BOOOOM!', '#ffd23f', 48);
  banner = { icon: '🏆', name: 'YOU SMASHED THE ROCK KING!', desc: 'Grab his treasure!', color: '#ffd23f', t: 0, dur: 3 };
}

// ---------- pickups ----------
function chooseUpgrade() {
  const waiting = new Set(pickups.map(p => p.type));
  const unowned = SPECIALS.filter(s => !gun.sp[s] && !waiting.has(s));
  if (specialCount() === 0 && unowned.length) return pick(unowned);   // first upgrade is always a cool one
  const opts = {};
  for (const s of unowned) opts[s] = 3;
  if (gun.power < 5) opts.power = 2;
  if (gun.rapid < 5) opts.rapid = 2;
  if (!Object.keys(opts).length) return 'heart';
  return weighted(opts);
}
function dropPickup(x, y, type) {
  pickups.push({ type, x: clamp(x, 30, W - 30), y: clamp(y, 40, H - 30), t: 0 });
  if (type !== 'heart') rings.push({ x, y, r: 6, max: 50, life: 0.4, maxLife: 0.4, color: UP[type].color });
}
function applyUpgrade(type) {
  const u = UP[type];
  let desc = u.desc;
  if (type === 'power') { if (gun.power < 5) gun.power++; else score += 100; desc = `Power level ${gun.power} of 5!`; }
  else if (type === 'rapid') { if (gun.rapid < 5) gun.rapid++; else score += 100; desc = `Speed level ${gun.rapid} of 5!`; }
  else if (type === 'heart') {
    if (player.hp < maxHp()) player.hp = Math.min(maxHp(), player.hp + 2); else score += 100;
    SFX.heal(); popText(player.x, player.y - 30, '+❤️', '#ff3b5c', 26);
    score += 20; return;
  }
  else { gun.sp[type] = true; gun.last = type; }
  score += 50;
  SFX.pickup();
  sparkle(player.x, player.y, u.color === '#ffffff' ? '#ffe9a0' : u.color, 24, 240);
  rings.push({ x: player.x, y: player.y, r: 10, max: 90, life: 0.45, maxLife: 0.45, color: u.color });
  banner = { icon: u.icon, name: u.name, desc, color: u.color, t: 0, dur: 2.6, rainbow: type === 'rainbow' };
}

// ---------- background art ----------
function makeBg(lv) {
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d');
  g.fillStyle = lv.ground; g.fillRect(0, 0, W, H);
  if (lv.theme === 'castle') {
    for (let y = 0; y < H; y += 64) for (let x = (y / 64 % 2) * -32; x < W; x += 64) {
      const v = randi(-12, 12);
      g.fillStyle = `rgba(${128 + v},${124 + v},${136 + v},0.35)`;
      g.fillRect(x + 2, y + 2, 60, 60);
    }
    g.fillStyle = '#7a1f2b'; g.fillRect(W / 2 - 80, 0, 160, H);
    g.fillStyle = '#d9a93a'; g.fillRect(W / 2 - 84, 0, 6, H); g.fillRect(W / 2 + 78, 0, 6, H);
  }
  for (let i = 0; i < 70; i++) {
    g.fillStyle = `rgba(${Math.random() < 0.5 ? '0,0,0' : '255,255,255'},${rand(0.03, 0.07)})`;
    g.beginPath(); g.ellipse(rand(0, W), rand(0, H), rand(30, 120), rand(20, 80), rand(0, 3), 0, 7); g.fill();
  }
  if (lv.theme === 'grass') {
    for (let i = 0; i < 300; i++) {
      const x = rand(0, W), y = rand(0, H);
      g.strokeStyle = `rgba(${randi(40, 90)},${randi(120, 175)},${randi(30, 60)},0.85)`; g.lineWidth = 2;
      g.beginPath(); for (let j = -1; j <= 1; j++) { g.moveTo(x + j * 3, y); g.lineTo(x + j * 5, y - rand(5, 11)); } g.stroke();
    }
    for (let i = 0; i < 40; i++) {
      const x = rand(0, W), y = rand(0, H), col = pick(['#ffe14d', '#ff7ab8', '#ffffff', '#8fd3ff']);
      g.fillStyle = col; for (let p = 0; p < 5; p++) { g.beginPath(); g.arc(x + Math.cos(p * 1.26) * 3, y + Math.sin(p * 1.26) * 3, 2.3, 0, 7); g.fill(); }
      g.fillStyle = '#f2a900'; g.beginPath(); g.arc(x, y, 1.8, 0, 7); g.fill();
    }
  }
  if (lv.theme === 'dirt' || lv.theme === 'lava' || lv.theme === 'castle') {
    for (let i = 0; i < 160; i++) {
      const v = randi(-30, 30);
      g.fillStyle = lv.theme === 'lava' ? `rgb(${40 + v / 2},${30 + v / 2},${28 + v / 2})` : `rgb(${130 + v},${115 + v},${95 + v})`;
      g.beginPath(); g.ellipse(rand(0, W), rand(0, H), rand(2, 6), rand(2, 4), rand(0, 3), 0, 7); g.fill();
    }
  }
  if (lv.theme === 'lava') {
    for (let i = 0; i < 14; i++) {
      let x = rand(0, W), y = rand(0, H), a = rand(0, 6.28);
      const pts = [[x, y]];
      for (let s = 0; s < 8; s++) { a += rand(-0.7, 0.7); x += Math.cos(a) * rand(15, 35); y += Math.sin(a) * rand(15, 35); pts.push([x, y]); }
      for (const [w, col, blur] of [[7, '#ff4a00', 18], [2.5, '#ffd25a', 0]]) {
        g.save(); g.strokeStyle = col; g.lineWidth = w; g.lineCap = 'round'; g.lineJoin = 'round'; g.shadowColor = '#ff5a00'; g.shadowBlur = blur;
        g.beginPath(); g.moveTo(pts[0][0], pts[0][1]); for (const p of pts) g.lineTo(p[0], p[1]); g.stroke(); g.restore();
      }
    }
  }
  if (lv.theme === 'cave') {
    for (let i = 0; i < 28; i++) {
      const x = rand(0, W), y = rand(0, H), s = rand(6, 16), col = pick(['#8d6bff', '#5fdcff', '#d07bff']);
      g.save(); g.shadowColor = col; g.shadowBlur = 14; g.fillStyle = col; g.globalAlpha = 0.85;
      for (let k = 0; k < 3; k++) {
        const a = -Math.PI / 2 + (k - 1) * 0.45;
        g.beginPath(); g.moveTo(x - 3, y); g.lineTo(x + Math.cos(a) * s * 1.6, y + Math.sin(a) * s * 1.6); g.lineTo(x + 3, y); g.fill();
      }
      g.restore();
    }
  }
  const grd = g.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 0.85);
  grd.addColorStop(0, 'rgba(0,0,0,0)'); grd.addColorStop(1, 'rgba(0,0,0,0.45)');
  g.fillStyle = grd; g.fillRect(0, 0, W, H);
  return c;
}

// ---------- key / click handling ----------
function onPress(k) {
  audioInit();
  if (k === 'm') { muted = !muted; return; }
  if (k === ' ') aimMode = 'key';
  const go = k === ' ' || k === 'enter';
  if (state === 'title') {
    if (k === 'escape') { location.href = '../index.html'; return; }
    if (go) { SFX.click(); startGame(); }
    else if (k === 'arrowleft' || k === 'arrowright' || k === 'arrowup' || k === 'arrowdown' || k === 'd') { easy = !easy; SFX.click(); }
  } else if (state === 'play') {
    if (k === 'p' || k === 'escape') state = 'pause';
  } else if (state === 'pause') {
    if (k === 'p' || k === 'escape' || go) state = 'play';
  } else if (state === 'dead') {
    if (go && deadT > 0.8) { SFX.click(); retryLevel(); }
  } else if (state === 'win') {
    if (go && deadT > 1.5) { SFX.click(); state = 'title'; }
  }
}
function onClick() {
  audioInit();
  for (const b of buttons) {
    if (mouse.x > b.x && mouse.x < b.x + b.w && mouse.y > b.y && mouse.y < b.y + b.h) { SFX.click(); b.action(); return; }
  }
  if (state === 'pause') { state = 'play'; return; }
  if (state === 'play') aimMode = 'mouse';
}

// ---------- update ----------
function update(dt) {
  T += dt;
  shake = Math.max(0, shake - 40 * dt);
  if (state === 'title') { updateTitle(dt); return; }
  if (state === 'pause') return;
  if (state === 'dead' || state === 'win') { deadT += dt; updateFx(dt); return; }

  // state === 'play'
  if (phase === 'intro') {
    phaseT -= dt;
    if (phaseT <= 0) { phase = 'fight'; if (lvl.boss) spawnBoss(); }
  } else if (phase === 'fight') {
    spawnT -= dt;
    const bossAlive = monsters.some(m => m.t.boss);
    if (spawnT <= 0 && toSpawn > 0 && monsters.length < lvl.maxAlive + (bossAlive ? 1 : 0)) {
      spawnMonster(weighted(lvl.mix)); toSpawn--;
      spawnT = Math.max(0.5, 1.3 - levelIdx * 0.06) * (easy ? 1.2 : 1) * rand(0.7, 1.3);
    }
    if (toSpawn === 0 && monsters.length === 0) {
      phase = 'clear'; phaseT = 3;
      score += 100 * (levelIdx + 1);
      SFX.clear(); confetti();
    }
  } else if (phase === 'clear') {
    phaseT -= dt;
    if (phaseT <= 0) {
      for (const p of pickups) applyUpgrade(p.type);
      if (levelIdx + 1 >= LEVELS.length) { state = 'win'; deadT = 0; saveBest(); SFX.win(); confetti(); }
      else startLevel(levelIdx + 1);
      return;
    }
  }
  updatePlayer(dt);
  updateBullets(dt);
  updateMonsters(dt);
  updateRocks(dt);
  updatePickups(dt);
  updateFx(dt);
}

function updatePlayer(dt) {
  const p = player;
  let mx = (keys['arrowright'] || keys['d'] ? 1 : 0) - (keys['arrowleft'] || keys['a'] ? 1 : 0);
  let my = (keys['arrowdown'] || keys['s'] ? 1 : 0) - (keys['arrowup'] || keys['w'] ? 1 : 0);
  const ml = Math.hypot(mx, my);
  if (ml > 0) { mx /= ml; my /= ml; p.walk += dt * 13; p.moveAng = Math.atan2(my, mx); }
  const sp = 240;
  p.x += (mx * sp + p.kx) * dt; p.y += (my * sp + p.ky) * dt;
  const kd = Math.exp(-8 * dt); p.kx *= kd; p.ky *= kd;
  p.x = clamp(p.x, p.r, W - p.r); p.y = clamp(p.y, p.r + 4, H - p.r - 4);

  const keyShoot = keys[' '];
  if (mouse.down && aimMode === 'mouse') p.ang = Math.atan2(mouse.y - p.y, mouse.x - p.x);
  else if (keyShoot) {
    const t = nearestTarget();
    if (t) {
      const dist = Math.sqrt(d2(t.x, t.y, p.x, p.y)), lead = dist / 560;
      p.ang = Math.atan2(t.y + (t.vy || 0) * lead - p.y, t.x + (t.vx || 0) * lead - p.x);
    } else p.ang = p.moveAng;
  }
  else if (aimMode === 'mouse') p.ang = Math.atan2(mouse.y - p.y, mouse.x - p.x);
  else p.ang = p.moveAng;

  p.cd -= dt; p.inv -= dt; p.flash -= dt;
  if ((keyShoot || mouse.down) && p.cd <= 0) fire();
}

function updateBullets(dt) {
  for (const b of bullets) {
    b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
    const f = b.fx;
    if (f.fire && Math.random() < 0.8) addP({ kind: 'glow', x: b.x, y: b.y, vx: rand(-30, 30), vy: rand(-30, 30), life: 0.3, size: rand(3, 6) + b.r * 0.5, color: pick(['#ff9a1a', '#ffcf3a', '#ff5a1a']) });
    if (f.ice && Math.random() < 0.5) addP({ kind: 'star', x: b.x + rand(-4, 4), y: b.y + rand(-4, 4), vx: rand(-20, 20), vy: rand(-20, 20), life: 0.45, size: rand(2, 4), color: '#d4f7ff' });
    if (f.zap && Math.random() < 0.6) addP({ kind: 'spark', x: b.x, y: b.y, vx: rand(-260, 260), vy: rand(-260, 260), life: 0.1, size: 2, color: '#e2ccff' });
    if (f.rocket && Math.random() < 0.7) addP({ kind: 'dot', grow: true, x: b.x - b.vx * 0.015, y: b.y - b.vy * 0.015, vx: rand(-15, 15), vy: rand(-15, 15), life: 0.45, size: rand(3, 5), color: 'rgba(210,210,210,0.55)' });
    if (f.rainbow && Math.random() < 0.8) addP({ kind: 'glow', x: b.x, y: b.y, vx: 0, vy: 0, life: 0.25, size: b.r, color: `hsl(${(T * 600 + b.hue) % 360},100%,60%)` });
    if (b.life <= 0 || b.x < -30 || b.x > W + 30 || b.y < -30 || b.y > H + 30) { b.dead = true; continue; }
    for (const m of monsters) {
      if (m.dead || b.hit.has(m.id)) continue;
      if (d2(b.x, b.y, m.x, m.y) < (m.r + b.r) ** 2) {
        hitMonster(m, b);
        if (f.rainbow) b.hit.add(m.id); else { b.dead = true; break; }
      }
    }
    if (b.dead) continue;
    for (const r of erocks) {
      if (r.dead) continue;
      if (d2(b.x, b.y, r.x, r.y) < (r.r + b.r + 3) ** 2) {
        r.dead = true; score += 5;
        debris(r.x, r.y, 8, '#8a6d55', '#4d3a2c', 6); SFX.hit();
        if (f.rocket) explode(b.x, b.y, b.dmg * 0.75, null);
        if (!f.rainbow) { b.dead = true; break; }
      }
    }
  }
  bullets = bullets.filter(b => !b.dead);
}

function updateMonsters(dt) {
  for (let i = 0; i < monsters.length; i++) {
    const m = monsters[i];
    if (m.dead) continue;
    m.hitFlash -= dt;
    if (m.slow > 0) m.slow -= dt;
    if (m.burn > 0) {
      m.burn -= dt; m.burnTick += dt;
      if (Math.random() < 0.6) addP({ kind: 'glow', x: m.x + rand(-m.r, m.r) * 0.7, y: m.y + rand(-m.r, m.r) * 0.7, vx: rand(-15, 15), vy: rand(-70, -30), life: 0.45, size: rand(4, 8), color: pick(['#ff9a1a', '#ffcf3a', '#ff5a1a']) });
      if (m.burnTick >= 0.4) { m.burnTick = 0; damage(m, 0.7); if (m.dead) continue; }
    }
    const dx = player.x - m.x, dy = player.y - m.y, d = Math.hypot(dx, dy) || 1;
    m.wob += dt * 2;
    const ang = Math.atan2(dy, dx) + Math.sin(m.wob) * (m.t.boss ? 0.2 : 0.5);
    const spd = m.spd * (m.slow > 0 ? 0.4 : 1);
    m.vx = Math.cos(ang) * spd; m.vy = Math.sin(ang) * spd;
    m.x += (m.vx + m.kx) * dt; m.y += (m.vy + m.ky) * dt;
    const kd = Math.exp(-6 * dt); m.kx *= kd; m.ky *= kd;
    m.rot += (m.vx >= 0 ? 1 : -1) * spd * dt / m.r * 0.5;
    const onscreen = m.x > 20 && m.x < W - 20 && m.y > 20 && m.y < H - 20;
    if (m.t.thrower && onscreen) {
      m.throwCd -= dt;
      if (m.throwCd <= 0) { m.throwCd = rand(3.2, 4.8); throwRock(m.x, m.y, Math.atan2(dy, dx), 150); }
    }
    if (m.t.boss) bossAI(m, dt);
    if (d < m.r + player.r - 4 && player.inv <= 0 && phase === 'fight') hurtPlayer(m.x, m.y);
  }
  // keep rocks from stacking on top of each other
  for (let i = 0; i < monsters.length; i++) for (let j = i + 1; j < monsters.length; j++) {
    const a = monsters[i], b = monsters[j];
    const dx = b.x - a.x, dy = b.y - a.y, min = a.r + b.r, dd = dx * dx + dy * dy;
    if (dd < min * min && dd > 0.01) {
      const d = Math.sqrt(dd), push = (min - d), wa = b.r / min, wb = a.r / min;
      a.x -= dx / d * push * wa; a.y -= dy / d * push * wa;
      b.x += dx / d * push * wb; b.y += dy / d * push * wb;
    }
  }
  monsters = monsters.filter(m => !m.dead);
}

function bossAI(m, dt) {
  m.stomp -= dt;
  m.bossCd -= dt;
  if (m.y < 80) { m.y += 40 * dt; return; }
  if (m.bossCd <= 0) {
    const angry = m.hp < m.maxHp * 0.5;
    m.bossCd = lvl.boss.cd * (angry ? 0.75 : 1) * (easy ? 1.15 : 1);
    m.atk = (m.atk + 1) % 2;
    m.stomp = 0.4; shake = Math.max(shake, 7);
    if (m.atk === 0) {
      const n = lvl.boss.ring, off = rand(0, 6.28);
      for (let i = 0; i < n; i++) throwRock(m.x, m.y, off + i / n * Math.PI * 2, 125);
      rings.push({ x: m.x, y: m.y, r: m.r, max: m.r + 60, life: 0.35, maxLife: 0.35, color: '#c9b9a6' });
    } else {
      const cnt = Math.min(3, 14 - monsters.length);
      for (let i = 0; i < cnt; i++) {
        const a = rand(0, 6.28), p = spawnMonster('pebble', m.x + Math.cos(a) * m.r, m.y + Math.sin(a) * m.r);
        p.kx = Math.cos(a) * 200; p.ky = Math.sin(a) * 200;
      }
    }
    SFX.roar();
  }
}

function hurtPlayer(sx, sy) {
  const p = player;
  p.hp--; p.inv = 1.6; shake = Math.max(shake, 9);
  SFX.hurt();
  const a = Math.atan2(p.y - sy, p.x - sx);
  p.kx = Math.cos(a) * 420; p.ky = Math.sin(a) * 420;
  for (const m of monsters) {
    const dd = d2(m.x, m.y, p.x, p.y);
    if (dd < 130 * 130 && !m.t.boss) { const b = Math.atan2(m.y - p.y, m.x - p.x); m.kx += Math.cos(b) * 260; m.ky += Math.sin(b) * 260; }
  }
  sparkle(p.x, p.y, '#ff6b6b', 12, 200);
  popText(p.x, p.y - 34, 'OUCH!', '#ff6b6b', 26);
  if (p.hp <= 0) { state = 'dead'; deadT = 0; SFX.lose(); saveBest(); }
}

function updateRocks(dt) {
  for (const r of erocks) {
    r.x += r.vx * dt; r.y += r.vy * dt; r.rot += dt * 8; r.life -= dt;
    if (r.life <= 0 || r.x < -40 || r.x > W + 40 || r.y < -40 || r.y > H + 40) { r.dead = true; continue; }
    if (player.inv <= 0 && phase === 'fight' && d2(r.x, r.y, player.x, player.y) < (r.r + player.r - 3) ** 2) {
      r.dead = true; hurtPlayer(r.x, r.y);
      if (state !== 'play') return;
    }
  }
  erocks = erocks.filter(r => !r.dead);
}

function updatePickups(dt) {
  for (const p of pickups) {
    p.t += dt;
    const dx = player.x - p.x, dy = player.y - p.y, d = Math.hypot(dx, dy) || 1;
    const magnet = phase === 'clear' ? 99999 : 130;

function updateFx(dt) {
  for (const p of parts) {
    p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt; p.life -= dt;
    if (!p.nofric) { const f = Math.exp(-(p.kind === 'chip' ? 4 : 3) * dt); p.vx *= f; p.vy *= f; }
  }
  parts = parts.filter(p => p.life > 0);
  for (const r of rings) { r.life -= dt; r.r += (r.max - r.r) * Math.min(1, dt * 12); }
  rings = rings.filter(r => r.life > 0);
  for (const b of bolts) b.life -= dt;
  bolts = bolts.filter(b => b.life > 0);
  for (const t of texts) { t.life -= dt; t.y -= 40 * dt; }
  texts = texts.filter(t => t.life > 0);
  if (banner) { banner.t += dt; if (banner.t > banner.dur) banner = null; }
}

function updateTitle(dt) {
  if (!titleBg) {
    titleBg = makeBg(LEVELS[0]);
    for (let i = 0; i < 7; i++) {
      const type = pick(['pebble', 'rock', 'boulder', 'lava', 'crystal']), t = MT[type];
      titleRocks.push({ t, x: rand(60, W - 60), y: rand(60, H - 60), r: t.r, vx: rand(-50, 50), vy: rand(-50, 50), rot: rand(0, 6), shape: makeShape(t.r), cracks: makeCracks(t.r), hp: 1, maxHp: 1, hitFlash: 0, slow: 0 });
    }
  }
  for (const m of titleRocks) {

    if (m.x < m.r || m.x > W - m.r) m.vx *= -1;
    if (m.y < m.r || m.y > H - m.r) m.vy *= -1;

}

// ---------- drawing ----------
function drawMonster(m, lookX, lookY) {
  const t = m.t, r = m.r;
  ctx.save(); ctx.translate(m.x, m.y);
  ctx.fillStyle = 'rgba(0,0,0,0.28)';
  ctx.beginPath(); ctx.ellipse(0, r * 0.75, r * 0.95, r * 0.4, 0, 0, 7); ctx.fill();
  if (m.stomp > 0) ctx.scale(1 + m.stomp * 0.25, 1 - m.stomp * 0.2);

  ctx.save(); ctx.rotate(m.rot);
  ctx.beginPath(); ctx.moveTo(m.shape[0][0], m.shape[0][1]);
  for (const p of m.shape) ctx.lineTo(p[0], p[1]);
  ctx.closePath();
  const g = ctx.createRadialGradient(-r * 0.35, -r * 0.4, r * 0.1, 0, 0, r * 1.1);
  g.addColorStop(0, t.crystal ? '#e6d6ff' : t.lava ? '#7a5048' : lighten(t.col)); g.addColorStop(1, t.dark);
  if (t.lava || t.crystal) { ctx.shadowColor = t.lava ? '#ff5a00' : '#c9a6ff'; ctx.shadowBlur = 16; }
  ctx.fillStyle = g; ctx.fill(); ctx.shadowBlur = 0;
  ctx.lineWidth = Math.max(2, r * 0.1); ctx.strokeStyle = t.dark; ctx.lineJoin = 'round'; ctx.stroke();
  const cracked = m.hp < m.maxHp * 0.5;
  if (t.lava || t.crystal || cracked) {
    ctx.save(); ctx.clip();
    for (const line of m.cracks) {
      ctx.beginPath(); ctx.moveTo(line[0][0], line[0][1]); for (const p of line) ctx.lineTo(p[0], p[1]);
      if (t.lava) { ctx.strokeStyle = '#ff8a1a'; ctx.lineWidth = 3; ctx.shadowColor = '#ff5a00'; ctx.shadowBlur = 8; }
      else if (t.crystal) { ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = 2; }
      else { ctx.strokeStyle = t.dark; ctx.lineWidth = 2.5; }
      ctx.stroke();
    }
    ctx.restore();
  }
  if (m.hitFlash > 0) { ctx.fillStyle = 'rgba(255,255,255,0.75)'; ctx.fill(); }
  if (m.slow > 0) { ctx.fillStyle = 'rgba(120,225,255,0.4)'; ctx.fill(); ctx.strokeStyle = '#c9f4ff'; ctx.lineWidth = 2; ctx.stroke(); }
  ctx.restore();

  // angry eyes (they always stay upright and look at you)
  const er = Math.max(3.5, r * 0.2), ex = r * 0.36, ey = -r * 0.12;
  const la = Math.atan2(lookY - m.y, lookX - m.x), px = Math.cos(la) * er * 0.45, py = Math.sin(la) * er * 0.45;
  for (const s of [-1, 1]) {
    ctx.fillStyle = t.lava ? '#ffd25a' : '#fff';
    ctx.beginPath(); ctx.arc(s * ex, ey, er, 0, 7); ctx.fill();
    ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(s * ex + px, ey + py, er * 0.55, 0, 7); ctx.fill();
    ctx.strokeStyle = '#1a120c'; ctx.lineWidth = Math.max(2, r * 0.1); ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(s * (ex + er * 1.1), ey - er * 1.5); ctx.lineTo(s * (ex - er * 0.7), ey - er * 0.7); ctx.stroke();
  }
  if (r >= 20) {
    ctx.strokeStyle = '#1a120c'; ctx.lineWidth = Math.max(2, r * 0.07);
    ctx.beginPath(); ctx.moveTo(-r * 0.3, r * 0.42);
    for (let i = 1; i <= 4; i++) ctx.lineTo(-r * 0.3 + i * r * 0.15, r * (i % 2 ? 0.32 : 0.42));
    ctx.stroke();
  }
  if (t.boss) {
    ctx.fillStyle = '#ffd23f'; ctx.strokeStyle = '#8a5a00'; ctx.lineWidth = 3;
    const cy = -r * 0.82, cw = r * 0.75;
    ctx.beginPath(); ctx.moveTo(-cw, cy); ctx.lineTo(-cw, cy - r * 0.32); ctx.lineTo(-cw * 0.5, cy - r * 0.15);
    ctx.lineTo(0, cy - r * 0.45); ctx.lineTo(cw * 0.5, cy - r * 0.15); ctx.lineTo(cw, cy - r * 0.32); ctx.lineTo(cw, cy); ctx.closePath();
    ctx.fill(); ctx.stroke();
    for (const [gx, col] of [[-cw * 0.55, '#ff3b5c'], [0, '#5fdcff'], [cw * 0.55, '#4fe06a']]) {
      ctx.fillStyle = col; ctx.beginPath(); ctx.arc(gx, cy - r * 0.08, r * 0.07, 0, 7); ctx.fill();
    }

  ctx.restore();

    const w = r * 1.6;
    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(m.x - w / 2 - 1, m.y - r - 13, w + 2, 6);
    ctx.fillStyle = '#4fe06a'; ctx.fillRect(m.x - w / 2, m.y - r - 12, w * Math.max(0, m.hp / m.maxHp), 4);

}
function lighten(hex) {
  const n = parseInt(hex.slice(1), 16);

// ---- RYDER (the hero) ----
// Drawn standing up, facing the way he shoots. Look: blond spiky hair,
// blue eyes, big toothy grin, red T-shirt with a blue patch, blue shorts with yellow ducks.
const RYDER = {
  skin: '#f7cba6', skinDark: '#e3a47e', line: '#5a3424',
  hair: '#f2d77a', hairLight: '#fff2b8', hairDark: '#c99d3e',
  eye: '#3d8fe0', shirt: '#d9252f', shirtDark: '#a3161f', patch: '#2d6cdf',
  shorts: '#8cc6ef', shortsDark: '#5d9ccc', duck: '#ffd23f', shoe: '#2b2f3a'

function drawPlayer(p, aimAng) {
  const C = RYDER, ca = Math.cos(aimAng), sa = Math.sin(aimAng);

  const moving = p.walk !== p.lastWalk; p.lastWalk = p.walk;
  const step = Math.sin(p.walk), bob = moving ? Math.abs(step) * 1.4 : 0;
  ctx.save(); ctx.translate(p.x, p.y);

  ctx.beginPath(); ctx.ellipse(0, 21, 13, 4.5, 0, 0, 7); ctx.fill();
  if (p.inv > 0 && Math.floor(p.inv * 14) % 2 === 0) ctx.globalAlpha = 0.4;
  const nsp = specialCount();
  if (nsp > 0) {
    ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha *= 0.12 + nsp * 0.03;
    ctx.fillStyle = gunColor(); ctx.beginPath(); ctx.arc(0, -2, p.r + 12 + Math.sin(T * 6) * 3, 0, 7); ctx.fill(); ctx.restore();
  }

  const rot = (x, y) => [x * ca - y * sa, x * sa + y * ca];
  const h1 = rot(7, 5), h2 = rot(17, 5);
  const gunBehind = sa < -0.35; // aiming up: gun goes behind him
  const gunLayer = () => {
    ctx.save(); ctx.rotate(aimAng); drawGun(p); ctx.restore();
    ctx.fillStyle = C.skin; ctx.strokeStyle = C.line; ctx.lineWidth = 1;
    for (const h of [h1, h2]) { ctx.beginPath(); ctx.arc(h[0], h[1], 2.8, 0, 7); ctx.fill(); ctx.stroke(); }
  };
  const arms = () => {
    ctx.strokeStyle = C.skin; ctx.lineWidth = 4.2; ctx.lineCap = 'round';
    const sh = [[-5.5, -1 - bob], [5.5, -1 - bob]];
    // each arm goes to the closer hand
    const pairs = face > 0 ? [[sh[0], h1], [sh[1], h2]] : [[sh[1], h1], [sh[0], h2]];
    for (const [s, h] of pairs) { ctx.beginPath(); ctx.moveTo(s[0], s[1]); ctx.lineTo(h[0], h[1]); ctx.stroke(); }
    ctx.fillStyle = C.shirt;
    for (const s of sh) { ctx.beginPath(); ctx.arc(s[0], s[1] + 0.5, 3.6, 0, 7); ctx.fill(); }
  };
  if (gunBehind) { gunLayer(); arms(); }

  ctx.save(); ctx.scale(face, 1);
  ctx.lineJoin = 'round';
  // legs + shoes
  const lift = [Math.max(0, step) * 3.5, Math.max(0, -step) * 3.5];
  [-3.6, 3.6].forEach((lx, i) => {
    const fy = 19 - (moving ? lift[i] : 0);
    ctx.strokeStyle = C.skin; ctx.lineWidth = 3.8; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(lx, 12); ctx.lineTo(lx, fy - 1); ctx.stroke();
    ctx.fillStyle = C.shoe; ctx.beginPath(); ctx.ellipse(lx + 1.2, fy, 3.6, 2.2, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.fillRect(lx - 1.8, fy + 0.6, 6, 1);
  });
  ctx.translate(0, -bob);
  // duck shorts
  ctx.fillStyle = C.shorts; ctx.strokeStyle = C.shortsDark; ctx.lineWidth = 1.2;
  rr(-7.5, 7, 15, 7, 2.5); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, 9.5); ctx.lineTo(0, 14); ctx.stroke();
  ctx.fillStyle = C.duck;
  for (const [dx, dy] of [[-4.5, 10.5], [3.5, 9.5], [-1.5, 12.6], [5.2, 12.4]]) {
    ctx.beginPath(); ctx.arc(dx, dy, 1.05, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(dx + 0.9, dy - 0.9, 0.7, 0, 7); ctx.fill();
  }
  // red T-shirt
  ctx.fillStyle = C.shirt; ctx.strokeStyle = C.shirtDark; ctx.lineWidth = 1.4;
  rr(-8, -4, 16, 13, 4.5); ctx.fill(); ctx.stroke();
  ctx.fillStyle = C.shirtDark; ctx.globalAlpha *= 0.5; rr(-8, 5, 16, 4, 2); ctx.fill(); ctx.globalAlpha /= 0.5;

  ctx.beginPath(); ctx.ellipse(hx - 9.6, hy + 1, 2.6, 3.2, 0, 0, 7); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.arc(hx, hy, 11, 0, 7); ctx.fill(); ctx.stroke();
  // short blond hair with spikes up front
  ctx.fillStyle = C.hair; ctx.strokeStyle = C.hairDark; ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(hx - 11.2, hy + 1.5);
  ctx.quadraticCurveTo(hx - 11.5, hy - 6, hx - 7, hy - 9.5);
  const spikes = [[-6, -12], [-3.5, -10.6], [-1.5, -13.4], [1, -11], [3.5, -13.8], [6, -10.8], [8.8, -12.4], [10.6, -7.5]];
  for (let i = 0; i < spikes.length; i++) {
    const [sx, sy] = spikes[i];
    ctx.lineTo(hx + sx, hy + sy + Math.sin(T * 4 + i) * (moving ? 0.6 : 0.2));
  }
  ctx.quadraticCurveTo(hx + 8.5, hy - 5, hx + 5, hy - 5.8);  // front fringe
  ctx.quadraticCurveTo(hx + 1, hy - 7.8, hx - 3, hy - 6.2);
  ctx.quadraticCurveTo(hx - 7.5, hy - 5, hx - 8.2, hy + 1.5); // sideburn
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = C.hairLight; ctx.lineWidth = 1.3; ctx.lineCap = 'round';
  for (const [a, b, c, d] of [[-5, -8, -3, -12], [0, -8.5, 2, -12.5], [5, -8, 7, -11]]) {
    ctx.beginPath(); ctx.moveTo(hx + a, hy + b); ctx.lineTo(hx + c, hy + d); ctx.stroke();
  }
  // face (shifted toward the way he's looking)
  const fx = hx + 2.2, lookX = Math.abs(ca) * 0.9, lookY = sa * 0.8;
  const hurt = p.inv > 0.35, blink = !hurt && (T % 3.7) < 0.12;
  ctx.strokeStyle = C.line; ctx.lineWidth = 1.2; ctx.lineCap = 'round';
  for (const ex of [fx - 3.8, fx + 3.6]) {
    if (hurt) {          // squeezed "> <" eyes
      const d = ex < fx ? 1 : -1;
      ctx.beginPath(); ctx.moveTo(ex - 1.8 * d, hy - 2.6); ctx.lineTo(ex + 1.6 * d, hy - 1.2); ctx.lineTo(ex - 1.8 * d, hy + 0.2); ctx.stroke();
    } else if (blink) {
      ctx.beginPath(); ctx.moveTo(ex - 2, hy - 1); ctx.lineTo(ex + 2, hy - 1); ctx.stroke();
    } else {
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.ellipse(ex, hy - 1.2, 2.5, 2.9, 0, 0, 7); ctx.fill();
      ctx.fillStyle = C.eye; ctx.beginPath(); ctx.arc(ex + lookX, hy - 1 + lookY, 1.75, 0, 7); ctx.fill();
      ctx.fillStyle = '#10243d'; ctx.beginPath(); ctx.arc(ex + lookX, hy - 1 + lookY, 0.85, 0, 7); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(ex + lookX + 0.6, hy - 1.7 + lookY, 0.55, 0, 7); ctx.fill();
    }
    ctx.strokeStyle = C.hairDark; ctx.lineWidth = 1; // eyebrows
    ctx.beginPath(); ctx.moveTo(ex - 1.8, hy - 4.6); ctx.quadraticCurveTo(ex, hy - 5.6, ex + 1.8, hy - 4.8); ctx.stroke();
    ctx.strokeStyle = C.line; ctx.lineWidth = 1.2;
  }
  // rosy cheeks
  ctx.fillStyle = 'rgba(255,120,120,0.35)';
  ctx.beginPath(); ctx.arc(fx - 6, hy + 2.6, 1.8, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(fx + 6.2, hy + 2.6, 1.8, 0, 7); ctx.fill();
  // nose
  ctx.strokeStyle = C.skinDark; ctx.beginPath(); ctx.arc(fx + 0.3, hy + 1.2, 1.1, -0.3, Math.PI * 0.7); ctx.stroke();
  // mouth: big toothy grin (or "oof!" when hurt)
  if (hurt) {
    ctx.fillStyle = '#7a1f22'; ctx.beginPath(); ctx.ellipse(fx, hy + 5.3, 1.6, 2, 0, 0, 7); ctx.fill();
  } else {
    ctx.fillStyle = '#7a1f22'; ctx.strokeStyle = C.line; ctx.lineWidth = 1;
    const mouth = () => {
      ctx.beginPath(); ctx.moveTo(fx - 4.4, hy + 3.4); ctx.quadraticCurveTo(fx, hy + 4.1, fx + 4.4, hy + 3.4);
      ctx.quadraticCurveTo(fx + 3.4, hy + 8.4, fx, hy + 8.2); ctx.quadraticCurveTo(fx - 3.4, hy + 8.4, fx - 4.4, hy + 3.4);

    mouth(); ctx.fill();
    ctx.save(); ctx.clip();

    ctx.fillStyle = '#f07a86'; ctx.beginPath(); ctx.ellipse(fx + 0.5, hy + 8.3, 2.4, 1.5, 0, 0, 7); ctx.fill();

  ctx.restore(); // end facing flip

  if (!gunBehind) { arms(); gunLayer(); }
  ctx.restore();
}
function drawGun(p) {

  ctx.fillStyle = '#262a31'; rr(2, y - w / 2, len, w, 3); ctx.fill();
  ctx.fillStyle = col; rr(10, y - w / 2 + 1.5, len - 12, w - 3, 2); ctx.fill();
  ctx.shadowBlur = 0;
  if (gun.sp.triple) {
    ctx.fillStyle = '#262a31';
    for (const s of [-1, 1]) { ctx.save(); ctx.translate(len - 4, y + s * w * 0.3); ctx.rotate(s * 0.25); rr(0, -2.5, 12, 5, 2); ctx.fill(); ctx.restore(); }
  }
  if (gun.sp.rocket) {
    ctx.fillStyle = UP.rocket.color;
    ctx.beginPath(); ctx.moveTo(6, y - w / 2); ctx.lineTo(0, y - w / 2 - 6); ctx.lineTo(14, y - w / 2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(6, y + w / 2); ctx.lineTo(0, y + w / 2 + 6); ctx.lineTo(14, y + w / 2); ctx.fill();
  }
  // one glowing light for every special power
  let i = 0;
  for (const s of SPECIALS) if (gun.sp[s]) {
    ctx.fillStyle = s === 'rainbow' ? `hsl(${(T * 400 + i * 60) % 360},100%,65%)` : UP[s].color;
    ctx.beginPath(); ctx.arc(13 + i * 4.2, y, 1.9, 0, 7); ctx.fill(); i++;

  // rapid fire = extra barrel rings
  ctx.fillStyle = '#111';
  for (let k = 0; k < gun.rapid; k++) ctx.fillRect(len - 2 - k * 4, y - w / 2 - 1, 2, w + 2);
  if (p.flash > 0) {
    const fc = col;
    ctx.save(); ctx.translate(len + 8, y); ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = fc; ctx.beginPath();
    for (let k = 0; k < 8; k++) { const a = k / 8 * Math.PI * 2, rad = k % 2 ? 4 : 10 + gun.power; ctx.lineTo(Math.cos(a) * rad, Math.sin(a) * rad); }
    ctx.fill(); ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0, 0, 4, 0, 7); ctx.fill(); ctx.restore();
  }
  ctx.restore();
}

function drawBullet(b) {

  const col = p.type === 'rainbow' ? `hsl(${(T * 300) % 360},100%,60%)` : u.color;
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.35;
  ctx.fillStyle = col; ctx.beginPath(); ctx.arc(0, 0, 24 * pulse, 0, 7); ctx.fill(); ctx.restore();
  ctx.fillStyle = 'rgba(20,20,30,0.75)'; ctx.strokeStyle = col; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(0, 0, 17 * pulse, 0, 7); ctx.fill(); ctx.stroke();
  emoji(u.icon, 0, 1, 20 * pulse);
  ctx.restore();
}

function drawParticles() {
  for (const pass of [false, true]) {
    if (pass) ctx.globalCompositeOperation = 'lighter';
    for (const p of parts) {
      if ((p.kind === 'glow') !== pass) continue;
      const a = clamp(p.life / p.max, 0, 1);
      ctx.globalAlpha = p.kind === 'chip' ? Math.min(1, a * 2.5) : a;
      ctx.fillStyle = p.color; ctx.strokeStyle = p.color;
      if (p.kind === 'chip') {
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.75); ctx.restore();
      } else if (p.kind === 'dot') {
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (p.grow ? 1 + (1 - a) * 1.5 : a), 0, 7); ctx.fill();
      } else if (p.kind === 'glow') {
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size * a + 1, 0, 7); ctx.fill();
      } else if (p.kind === 'spark') {
        ctx.lineWidth = p.size; ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * 0.03, p.y - p.vy * 0.03); ctx.stroke();
      } else if (p.kind === 'star') {
        const s = p.size * (0.5 + a);
        ctx.beginPath(); ctx.moveTo(p.x, p.y - s); ctx.lineTo(p.x + s * 0.3, p.y - s * 0.3); ctx.lineTo(p.x + s, p.y); ctx.lineTo(p.x + s * 0.3, p.y + s * 0.3);
        ctx.lineTo(p.x, p.y + s); ctx.lineTo(p.x - s * 0.3, p.y + s * 0.3); ctx.lineTo(p.x - s, p.y); ctx.lineTo(p.x - s * 0.3, p.y - s * 0.3); ctx.closePath(); ctx.fill();
      }
    }
  }
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
}

function drawFx() {
  for (const b of bolts) {
    const a = b.life / b.max;
    ctx.save(); ctx.globalAlpha = a; ctx.lineJoin = 'round';
    ctx.shadowColor = '#b98cff'; ctx.shadowBlur = 14;
    for (const [w, c] of [[5, '#b98cff'], [2, '#ffffff']]) {
      ctx.strokeStyle = c; ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(b.pts[0][0], b.pts[0][1]);
      for (const p of b.pts) ctx.lineTo(p[0] + rand(-2, 2), p[1] + rand(-2, 2)); ctx.stroke();
    }
    ctx.restore();
  }
  for (const r of rings) {
    ctx.globalAlpha = clamp(r.life / r.maxLife, 0, 1);
    ctx.strokeStyle = r.color; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, 7); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  for (const t of texts) {
    const a = t.life / t.max, pop = 1 + Math.max(0, (a - 0.8) * 2);
    ctx.globalAlpha = Math.min(1, a * 2);
    if (/\p{Extended_Pictographic}/u.test(t.str)) {
      text(t.str.replace(/\p{Extended_Pictographic}|️/gu, ''), t.x - 12, t.y, t.size * pop, t.color);
      emoji('❤️', t.x + 10, t.y, t.size * pop);
    } else text(t.str, t.x, t.y, t.size * pop, t.color);
  }
  ctx.globalAlpha = 1;
}

function button(label, x, y, w, h, col, action) {
  const hover = mouse.x > x && mouse.x < x + w && mouse.y > y && mouse.y < y + h;
  buttons.push({ x, y, w, h, action });
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.35)'; rr(x + 3, y + 5, w, h, 14); ctx.fill();
  ctx.fillStyle = hover ? lighten(col) : col; rr(x, y, w, h, 14); ctx.fill();
  ctx.strokeStyle = '#1a0f08'; ctx.lineWidth = 3; ctx.stroke();
  ctx.restore();
  text(label, x + w / 2, y + h / 2 + 1, Math.min(30, h * 0.5), '#fff');
}

function drawHUD() {
  const mh = maxHp();
  for (let i = 0; i < mh; i++) emoji(i < player.hp ? '❤️' : '🖤', 26 + i * 30, 28, 24, i < player.hp ? 1 : 0.5);
  text(`SCORE ${score}`, W - 18, 28, 22, '#ffd23f', 'right');
  text(`LEVEL ${levelIdx + 1}: ${lvl.name}`, W / 2, 24, 20, '#fff');
  const boss = monsters.find(m => m.t.boss);
  if (boss) {
    const bw = 360, bx = W / 2 - bw / 2;
    ctx.fillStyle = 'rgba(0,0,0,0.6)'; rr(bx - 3, 41, bw + 6, 18, 8); ctx.fill();
    ctx.fillStyle = '#ff3b5c'; rr(bx, 44, bw * Math.max(0, boss.hp / boss.maxHp), 12, 6); ctx.fill();
    emoji('👑', bx - 18, 50, 18);
  } else if (phase === 'fight') {
    const left = toSpawn + monsters.length, bw = 220, bx = W / 2 - bw / 2;
    ctx.fillStyle = 'rgba(0,0,0,0.5)'; rr(bx - 3, 41, bw + 6, 14, 7); ctx.fill();
    const done = 1 - left / Math.max(1, lvl.count);
    ctx.fillStyle = '#4fe06a'; rr(bx, 44, Math.max(0, bw * clamp(done, 0, 1)), 8, 4); ctx.fill();
    text(`${left} rocks left`, W / 2, 68, 14, '#fff');
  }
  // gun panel — shows what you have, and the dim icons are what you can still find
  const px = 12, py = H - 58;
  ctx.fillStyle = 'rgba(0,0,0,0.45)'; rr(px, py, 370, 46, 12); ctx.fill();
  emoji('💪', px + 22, py + 23, 20);
  for (let i = 0; i < 5; i++) { ctx.fillStyle = i < gun.power ? UP.power.color : 'rgba(255,255,255,0.18)'; rr(px + 38 + i * 11, py + 15, 8, 16, 2); ctx.fill(); }
  emoji('⏩', px + 112, py + 23, 20);
  for (let i = 0; i < 5; i++) { ctx.fillStyle = i < gun.rapid ? UP.rapid.color : 'rgba(255,255,255,0.18)'; rr(px + 128 + i * 11, py + 15, 8, 16, 2); ctx.fill(); }
  SPECIALS.forEach((s, i) => emoji(UP[s].icon, px + 208 + i * 27, py + 23, 21, gun.sp[s] ? 1 : 0.2));
  text(muted ? '🔇 M = sound   P = pause' : 'M = sound   P = pause', W - 14, H - 18, 13, 'rgba(255,255,255,0.8)', 'right');
}

function drawBanner() {
  if (!banner) return;
  const b = banner, t = b.t;
  const s = t < 0.25 ? 0.5 + t * 2 * 1.1 : t > b.dur - 0.35 ? Math.max(0, (b.dur - t) / 0.35) : 1;
  ctx.save(); ctx.translate(W / 2, 150); ctx.scale(s, s);
  ctx.fillStyle = 'rgba(0,0,0,0.55)'; rr(-300, -52, 600, 104, 22); ctx.fill();
  const col = b.rainbow ? `hsl(${(T * 300) % 360},100%,62%)` : b.color;
  ctx.strokeStyle = col; ctx.lineWidth = 4; ctx.stroke();
  emoji(b.icon, -240, 0, 54);
  text(b.name, 30, -14, 38, col);
  text(b.desc, 30, 26, 20, '#fff');
  ctx.restore();
}

function overlay(alpha) { ctx.fillStyle = `rgba(10,6,4,${alpha})`; ctx.fillRect(0, 0, W, H); }

function drawTitle() {
  ctx.drawImage(titleBg, 0, 0);
  for (const m of titleRocks) drawMonster(m, mouse.x, mouse.y);
  drawParticles();
  overlay(0.35);
  const wob = Math.sin(T * 3) * 4;
  text('RYDER THE', W / 2, 104 + wob, 64, '#ff9a3c');
  text('ROCK BUSTER!', W / 2, 180 - wob, 92, '#ffd23f');
  text('A game by RJ', W / 2, 250, 26, '#fff');
  const hero = { x: W / 2, y: 330, r: 16, inv: 0, walk: T * 6, flash: (T % 0.4) < 0.06 ? 1 : 0 };
  ctx.save(); ctx.translate(hero.x, hero.y); ctx.scale(1.8, 1.8); ctx.translate(-hero.x, -hero.y);
  drawPlayer(hero, Math.sin(T * 1.5) * 1.2 - Math.PI / 2);
  ctx.restore();

  ctx.fillStyle = 'rgba(0,0,0,0.55)'; rr(W / 2 - 290, 380, 580, 128, 16); ctx.fill();
  text('⬅ ⬆ ➡ ⬇   Arrow keys to move', W / 2, 408, 22, '#fff');
  text('SPACE   Hold to shoot (it aims for you!)', W / 2, 442, 22, '#fff');
  text('Grab the glowing prizes to power up your gun!', W / 2, 478, 20, '#ffd23f');

  button('▶  PLAY  (SPACE)', W / 2 - 250, 528, 260, 64, '#3fae4f', () => startGame());
  button(easy ? '🧒 Kid Mode' : '💪 Hard Mode', W / 2 + 26, 528, 224, 64, easy ? '#2d6cdf' : '#c0392b', () => { easy = !easy; });
  text('← → to switch mode', W / 2 + 138, 610, 14, 'rgba(255,255,255,0.85)');
  if (best > 0) text(`BEST SCORE ${best}`, W - 18, 26, 18, '#ffd23f', 'right');
  button('🏠 Arcade', 14, 12, 150, 44, '#7a4bc4', () => { location.href = '../index.html'; });
}

function draw() {
  buttons = [];
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  ctx.save();
  if (shake > 0) ctx.translate(rand(-shake, shake), rand(-shake, shake));
  if (state === 'title') { drawTitle(); ctx.restore(); return; }

  ctx.drawImage(bg, 0, 0);
  for (const p of pickups) drawPickup(p);
  for (const r of erocks) drawRockBall(r);
  for (const m of monsters) drawMonster(m, player.x, player.y);
  if (state !== 'dead') drawPlayer(player, player.ang);
  for (const b of bullets) drawBullet(b);
  drawParticles();
  drawFx();
  ctx.restore();

  drawHUD();
  drawBanner();

  if (state === 'play' && phase === 'intro') {
    const t = 2.4 - phaseT, s = Math.min(1, t * 3);
    ctx.save(); ctx.globalAlpha = Math.min(1, phaseT * 2);
    text(`LEVEL ${levelIdx + 1}`, W / 2, H / 2 - 50, 80 * s, '#ffd23f');
    text(lvl.name, W / 2, H / 2 + 20, 40 * s, '#fff');
    text(lvl.boss ? 'Watch out for the Rock King!' : 'Get ready!', W / 2, H / 2 + 70, 24, '#ff9a3c');
    ctx.restore();
  }
  if (state === 'play' && phase === 'clear') {
    text('LEVEL CLEAR!', W / 2, H / 2 - 30, 76, '#4fe06a');
    for (let i = 0; i < 3; i++) emoji('⭐', W / 2 + (i - 1) * 80, H / 2 + 50 + Math.sin(T * 6 + i) * 8, 56);
  }
  if (state === 'pause') {
    overlay(0.55);
    text('PAUSED', W / 2, H / 2 - 30, 80, '#ffd23f');
    text('Press P or SPACE to keep playing', W / 2, H / 2 + 40, 26, '#fff');
  }
  if (state === 'dead') {
    overlay(Math.min(0.6, deadT));
    text('OH NO!', W / 2, H / 2 - 110, 86, '#ff6b6b');
    text('The rock monsters got Ryder!', W / 2, H / 2 - 40, 32, '#fff');
    text('Don\'t worry — you keep all your gun power-ups!', W / 2, H / 2 + 5, 22, '#ffd23f');
    if (deadT > 0.8) {
      button('↻  TRY AGAIN  (SPACE)', W / 2 - 170, H / 2 + 50, 340, 70, '#3fae4f', () => retryLevel());
    }
  }
  if (state === 'win') {
    overlay(Math.min(0.6, deadT));
    emoji('🏆', W / 2, H / 2 - 150, 90);
    text('YOU WIN!', W / 2, H / 2 - 60, 90, '#ffd23f');
    text('Ryder beat the Rock King and saved the world!', W / 2, H / 2 + 5, 28, '#fff');
    text(`SCORE ${score}    BEST ${best}`, W / 2, H / 2 + 50, 26, '#4fe06a');
    if (deadT > 1.5) button('PLAY AGAIN  (SPACE)', W / 2 - 160, H / 2 + 95, 320, 66, '#3fae4f', () => { state = 'title'; });
    drawParticles();
  }
}

// ---------- main loop ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  requestAnimationFrame(frame);
  try { update(dt); draw(); } catch (e) { console.error(e); }
}
requestAnimationFrame(frame);
</script>
</body>
</html>
